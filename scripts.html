// ── SESSION HELPERS ──────────────────────────────────────────
function getSession() {
  try { return JSON.parse(localStorage.getItem('erp_session') || '{}'); }
  catch(e) { return {}; }
}
function getToken() { return getSession().token || ''; }
function getRole()  { return getSession().role  || ''; }

// ── INIT ─────────────────────────────────────────────────────
// Called by index.html after session is validated.
function initApp() {

    });

  loadSavedTheme();

// ── NAVIGATION ───────────────────────────────────────────────
function setupNavigation() {
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      showPage(link.dataset.page);
    });
  });
}

async function showPage(page) {
  state.currentPage = page;
  document.querySelectorAll('.nav-link').forEach(l =>
    l.classList.toggle('active', l.dataset.page === page)
  );
  showLoading('Loading...');
  try {
    switch (page) {
      case 'dashboard'        : await loadDashboard();         break;
      case 'purchase-orders'  : await loadPurchaseOrders();    break;
      case 'fabric-receiving' : await loadFabricReceiving();   break;
      case 'inventory'        : await loadInventory();         break;
      case 'stock-issue'      : await loadStockIssue();        break;
      case 'stock-returns'    : await loadStockReturns();      break;
      case 'vendors'          : await loadVendors();           break;
      case 'customers'        : await loadCustomers();         break;
      case 'articles'         : await loadArticles();          break;
      case 'sales-orders'     : await loadSalesOrders();       break;
      case 'production-orders': await loadProductionOrders();  break;
      case 'reports'          : await loadReports();           break;
      case 'stock-ledger'     : await loadStockLedger();       break;
      case 'activity-logs'    : await loadActivityLogs();      break;
      case 'change-password'  :       loadChangePassword();    break;
      case 'user-management'  : await loadUserManagement();    break;

      default: break;
    }
  } catch(e) {
    toast('Page error: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
  closeMobileSidebar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── API CALL ─────────────────────────────────────────────────
// Auto-injects _token. Handles AUTH_FAILED globally.
function callAPI(action, payload) {
  return new Promise((resolve, reject) => {
    const p = Object.assign({}, payload || {});
    p._token = getToken();
    google.script.run
      .withSuccessHandler(res => {
        try {
          const r = typeof res === 'string' ? JSON.parse(res) : res;
          if (!r.success && (r.error === 'AUTH_FAILED' || r.error === 'AUTH_REQUIRED')) {
            localStorage.removeItem('erp_session');
            toast('Session expired. Redirecting to login...', 'warning', 2500);
            setTimeout(() => {
              if (typeof redirectToLogin === 'function') redirectToLogin();
            }, 2500);
            resolve(r); return;
          }
          resolve(r);
        } catch(e) { reject(new Error('Invalid server response')); }
      })
      .withFailureHandler(err => reject(err))
      .dispatch(action, JSON.stringify(p));
  });
}

// ── SETUP ────────────────────────────────────────────────────
async function runSetup() {
  if (!confirm('Initialize/repair all database sheets? Safe to run at any time.')) return;
  showLoading('Initializing database...');
  try {
    const res = await callAPI('setup');
    if (res.success) toast('Database initialized!', 'success');
    else toast('Setup error: ' + res.error, 'error');
  } catch(e) { toast('Error: ' + e.message, 'error'); }
  finally { hideLoading(); }
}

// ── PURCHASE ORDERS ───────────────────────────────────────────
async function loadPurchaseOrders() {
  const [posRes, vendorsRes] = await Promise.all([
    callAPI('getPOs', { status: 'All' }),
    callAPI('getVendors')
  ]);
  state.pos     = posRes.success ? posRes.data : [];
  state.vendors = vendorsRes.data || [];

  document.getElementById('pageContent').innerHTML = `
  <div class="page-header">
    <div><div class="page-title">📋 Purchase Orders</div><div class="page-sub">Manage fabric procurement orders</div></div>
    <div class="page-actions">
      <button class="btn btn-outline btn-sm" onclick="exportTableToCSV('poTable','PurchaseOrders')">⬇ Export CSV</button>
      <button class="btn btn-outline btn-sm" onclick="showCreatePOModal()">+ Create PO</button>
    </div>
  </div>
  <div class="filters-bar">
    <div class="form-group"><div class="form-label">Status</div>
      <select class="form-control" id="poStatusFilter" onchange="filterPOs()">
        <option>All</option><option>Pending</option><option>Partial</option><option>Completed</option><option>Cancelled</option>
      </select></div>
    <div class="form-group"><div class="form-label">Vendor</div>
      <input class="form-control" id="poVendorFilter" placeholder="Search vendor..." oninput="filterPOs()"/></div>
    <div class="form-group"><div class="form-label">Article</div>
      <input class="form-control" id="poArticleFilter" placeholder="Article number..." oninput="filterPOs()"/></div>
    <button class="btn btn-outline btn-sm" style="align-self:flex-end" onclick="resetPOFilters()">Clear</button>
  </div>
  <div class="card"><div class="table-wrap">
    <table class="table" id="poTable">
      <thead><tr>
        <th>PO Number</th><th>Vendor</th><th>Article</th><th>Fabric</th><th>Color</th>
        <th>Width</th><th>Ordered Qty</th><th>Received</th><th>Balance</th>
        <th>Delivery</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody id="poTableBody">${renderPORows(state.pos)}</tbody>
    </table>
  </div></div>`;
}

function renderPORows(pos) {
  if (!pos || !pos.length) return '<tr><td colspan="12" class="table-empty">No purchase orders found</td></tr>';
  return pos.map(po => `<tr>
    <td class="mono fw-bold">${po.PO_Number}</td><td>${po.Vendor_Name}</td>
    <td class="fs-sm">${po.Article_Number||'—'}</td><td>${po.Fabric_Name}</td><td>${po.Color}</td>
    <td class="fs-sm">${po.Width} ${po.Width_Unit}</td>
    <td class="fw-bold">${fmtNum(po.Ordered_Qty)} ${po.Unit}</td>
    <td class="text-success">${fmtNum(po.Total_Received)}</td>
    <td class="${po.Balance_Qty>0?'text-warning':'text-success'} fw-bold">${fmtNum(po.Balance_Qty)}</td>
    <td class="fs-sm">${fmtDate(po.Delivery_Date)}</td>
    <td><span class="badge ${poStatusBadge(po.Status)}">${po.Status}</span></td>
    <td style="white-space:nowrap">
      <button class="btn btn-xs btn-outline" onclick="viewPO('${po.PO_Number}')">View</button>
      <button class="btn btn-xs btn-success" onclick="showReceiveModal('${po.PO_Number}')" ${po.Status==='Completed'||po.Status==='Cancelled'?'disabled':''}>Receive</button>
    </td>
  </tr>`).join('');
}

function filterPOs() {
  const status  = document.getElementById('poStatusFilter').value;
  const vendor  = (document.getElementById('poVendorFilter').value||'').toLowerCase();
  const article = (document.getElementById('poArticleFilter').value||'').toLowerCase();
  const filtered = (state.pos||[]).filter(po => {
    if (status !== 'All' && po.Status !== status) return false;
    if (vendor  && !po.Vendor_Name.toLowerCase().includes(vendor)) return false;
    if (article && !String(po.Article_Number).toLowerCase().includes(article)) return false;
    return true;
  });
  document.getElementById('poTableBody').innerHTML = renderPORows(filtered);
}

function resetPOFilters() {
  ['poStatusFilter','poVendorFilter','poArticleFilter'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.value=el.tagName==='SELECT'?'All':'';
  });
  document.getElementById('poTableBody').innerHTML = renderPORows(state.pos);
}

function poStatusBadge(s) {
  return {Pending:'badge-warning',Partial:'badge-info',Completed:'badge-success',Cancelled:'badge-danger'}[s]||'badge-secondary';
}

        </select></div>
      <div class="form-group"><label class="form-label">Article Number</label><input class="form-control" id="po_article" placeholder="ART-1025"/></div>
      <div class="form-group"><label class="form-label required">Fabric Name</label><input class="form-control" id="po_fabric" required/></div>
      <div class="form-group"><label class="form-label required">Color</label><input class="form-control" id="po_color" required/></div>
      <div class="form-group"><label class="form-label">Width</label><input class="form-control" id="po_width" type="number"/></div>
      <div class="form-group"><label class="form-label">Width Unit</label>

      <div class="form-group"><label class="form-label required">Ordered Qty</label><input class="form-control" id="po_qty" type="number" min="1" step="0.01" required/></div>
        <div class="form-group">
        <label class="form-label">Rate</label>
        <input class="form-control" id="po_rate" type="number" step="0.01" min="0" placeholder="0.00"/>
      </div>
      <div class="form-group"><label class="form-label">Unit</label>
        <select class="form-control" id="po_unit"><option>Meter</option><option>Yard</option><option>Roll</option><option>KG</option></select></div>
      <div class="form-group"><label class="form-label required">Delivery Date</label><input class="form-control" id="po_delivery" type="date" required/></div>
    </div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-control" id="po_notes" rows="2"></textarea></div>
  `,[
    {label:'Cancel',cls:'btn-outline',action:closeModal},
    {label:'✓ Create PO',cls:'btn-primary',action:submitCreatePO}
  ]);
}

async function submitCreatePO() {
  const vendor = document.getElementById('po_vendor').value;
  if (!vendor) { toast('Please select a vendor','warning'); return; }
  const fabric = document.getElementById('po_fabric').value;
  if (!fabric) { toast('Fabric Name is required','warning'); return; }
  const color = document.getElementById('po_color').value;
  if (!color) { toast('Color is required','warning'); return; }
  const qty = document.getElementById('po_qty').value;
  if (!qty || parseFloat(qty) <= 0) { toast('Valid Ordered Quantity is required','warning'); return; }
  const delivery = document.getElementById('po_delivery').value;
  if (!delivery) { toast('Delivery Date is required','warning'); return; }

  // 1. Safely extract the rate value from the correct input ID element
  const rateValue = document.getElementById('po_rate').value;

  showLoading('Creating PO...');
  try {
    const res = await callAPI('createPO',{
      vendorName   : vendor,
      articleNumber: document.getElementById('po_article').value,
      fabricName   : fabric,
      color        : color,
      width        : document.getElementById('po_width').value,
      widthUnit    : document.getElementById('po_widthUnit').value,
      orderedQty   : qty,
      
      // 2. Pass the extracted rate variable down to Apps Script payload
      rate         : rateValue,
      
      unit         : document.getElementById('po_unit').value,
      deliveryDate : delivery,
      notes        : document.getElementById('po_notes').value
    });
    if(res.success){toast('PO '+res.data.poNumber+' created!','success');closeModal();await loadPurchaseOrders();}
    else toast('Error: '+res.error,'error');
  } catch(e){toast('Error: '+e.message,'error');}
  finally{hideLoading();}
}

  showLoading('Loading PO...');
  const res = await callAPI('getPOById',{id:poNumber});
  hideLoading();
  if(!res.success){toast('Error: '+res.error,'error');return;}
  const po=res.data;
  openModal('PO: '+poNumber,`
    <div class="form-grid">
      ${infoRow('PO Number',po.PO_Number)}${infoRow('Vendor',po.Vendor_Name)}
      ${infoRow('Article',po.Article_Number||'—')}${infoRow('Fabric',po.Fabric_Name)}
      ${infoRow('Color',po.Color)}${infoRow('Width',po.Width+' '+po.Width_Unit)}
      ${infoRow('Ordered',fmtNum(po.Ordered_Qty)+' '+po.Unit)}${infoRow('Received',fmtNum(po.Total_Received)+' '+po.Unit)}
      ${infoRow('Balance',fmtNum(po.Balance_Qty)+' '+po.Unit)}${infoRow('Delivery',fmtDate(po.Delivery_Date))}
      ${infoRow('Status','<span class="badge '+poStatusBadge(po.Status)+'">'+po.Status+'</span>')}
      ${infoRow('Created',fmtDateTime(po.Created_At))}
    </div>
    ${po.receipts&&po.receipts.length?`<hr class="divider"/><div class="fw-600 mb-1">GRN History (${po.receipts.length})</div>
    <div class="table-wrap"><table class="table"><thead><tr><th>GRN</th><th>Qty</th><th>Batch</th><th>Date</th></tr></thead>
    <tbody>${po.receipts.map(r=>`<tr><td class="mono">${r.GRN_Number}</td><td>${fmtNum(r.Received_Qty)}</td><td>${r.Batch_Number||'—'}</td><td class="fs-sm">${fmtDate(r.Received_At)}</td></tr>`).join('')}</tbody></table></div>`:''}
  `,[{label:'Close',cls:'btn-outline',action:closeModal}]);
}

// PATCH FOR scripts.html
// Replace the existing submitReceiveFabric() function
// with this new version that handles:
//   1. Over-receive → shows info toast with excess qty
//   2. Under-receive → shows modal asking what to do
//   3. Exact receive → success toast as before
// Also add the new showUnderReceiveModal() and closePOFromModal() functions

// ============================================================
// PATCH v2 FOR scripts.html — Replace submitReceiveFabric()
// and add all helper functions after it.
//
// NEW FLOW:
//   1. User fills form and clicks Save
//   2. BEFORE any API call, check qty vs balance
//   3. If over  → confirmation dialog → user confirms → save
//   4. If under → choice modal (Mark Complete / Receive Later)
//                 → user picks → save with that intent
//   5. If exact → save directly
// ============================================================

async function submitReceiveFabric() {
  const poNumber = document.getElementById('rec_po').value;
  if (!poNumber) { toast('Select a Purchase Order', 'warning'); return; }

  const recQty = parseFloat(document.getElementById('rec_qty').value);
  if (!recQty || recQty <= 0) { toast('Enter a valid received quantity', 'warning'); return; }

  // --- CAPTURE EXTRA FIELDS SAFELY NOW BEFORE MODALS OPEN ---
  const extraFields = {
    receivedQty:     document.getElementById('rec_qty')?.value || "0",
    batchNumber:    document.getElementById('rec_batch')?.value || "",
    dyeLot:         document.getElementById('rec_dyeLot')?.value || "",
    qualityStatus:  document.getElementById('rec_quality')?.value || "",
    storageLocation:document.getElementById('rec_location')?.value || "",
    notes:          document.getElementById('rec_notes')?.value || ""
  };

  // Find the selected PO to get its balance
  const po = (state.pendingPOs || []).find(p => p.PO_Number === poNumber);
  const balance = po ? parseFloat(po.Balance_Qty) || 0 : 0;

  // ── SCENARIO A: Over Receive ──────────────────────────────
  if (recQty > balance + 0.001) {
    const excess = Math.round((recQty - balance) * 1000) / 1000;
    openModal(
      '⚠️ Over Receiving — Confirm',
      `
      <div class="warn-box mb-2" style="font-size:15px;line-height:1.7">
        You are receiving <strong>${fmtNum(recQty)} ${po ? po.Unit : 'units'}</strong>
        but the PO balance is only <strong>${fmtNum(balance)} ${po ? po.Unit : 'units'}</strong>.<br/>
        This will record an excess of <strong>${fmtNum(excess)} units</strong>
        and mark the PO as <strong>Over Received</strong>.
      </div>
      <p style="color:var(--text-muted);font-size:14px;margin:0">
        Do you want to continue?
      </p>
      `,
      [
        { label: 'Cancel', cls: 'btn-outline', action: closeModal },
        {
          label: '✓ Yes, Save GRN',
          cls: 'btn-warning',
          action: () => { closeModal(); _doSaveGRN(poNumber, 'over', null, extraFields); }
        }
      ]
    );
    return;
  }

  // ── SCENARIO B: Under Receive ─────────────────────────────
  if (recQty < balance - 0.001) {
    const remaining = Math.round((balance - recQty) * 1000) / 1000;
    
    // Stringify fields to safely pass them into the HTML string onclick event
    const safeFieldsStr = encodeURIComponent(JSON.stringify(extraFields));

    openModal(
      '⚠️ Partial Receipt — What would you like to do?',
      `
      <div class="info-box mb-3" style="font-size:15px;line-height:1.7">
        You are receiving <strong>${fmtNum(recQty)} ${po ? po.Unit : 'units'}</strong>
        against a balance of <strong>${fmtNum(balance)} ${po ? po.Unit : 'units'}</strong>.<br/>
        <strong>${fmtNum(remaining)} units</strong> will remain pending.
      </div>
      <p style="font-weight:600;margin:0 0 12px">Choose what to do with the remaining balance:</p>
      <div style="display:flex;flex-direction:column;gap:12px">

        <div class="card" style="border:2px solid var(--success);cursor:pointer;padding:0"
             onclick="closeModal();_doSaveGRN('${poNumber}','under','complete', JSON.parse(decodeURIComponent('${safeFieldsStr}')))">
          <div class="card-body" style="padding:16px 20px">
            <div class="fw-bold" style="color:var(--success);font-size:15px">
              ✅ Save GRN &amp; Mark PO Complete
            </div>
            <div class="fs-sm text-muted mt-1">
              GRN will be saved. The remaining ${fmtNum(remaining)} units will be
              written off. No further receipts allowed against this PO.
            </div>
          </div>
        </div>

        <div class="card" style="border:2px solid var(--primary);cursor:pointer;padding:0"
             onclick="closeModal();_doSaveGRN('${poNumber}','under','partial', JSON.parse(decodeURIComponent('${safeFieldsStr}')))">
          <div class="card-body" style="padding:16px 20px">
            <div class="fw-bold" style="color:var(--primary);font-size:15px">
              🕐 Save GRN &amp; Receive Balance Later
            </div>
            <div class="fs-sm text-muted mt-1">
              GRN will be saved. PO stays open as <strong>Partial</strong>.
              You can create another GRN when the remaining
              ${fmtNum(remaining)} units arrive.
            </div>
          </div>
        </div>

      </div>
      `,
      [] // No footer buttons — user clicks one of the cards above
    );
    return;
  }

  // ── SCENARIO C: Exact Receive ─────────────────────────────
  // qty == balance exactly, save directly
  await _doSaveGRN(poNumber, 'exact', null, extraFields);
}

// ── INTERNAL: Actually call the API and save the GRN ─────────
// intent: 'over' | 'under' | 'exact'
// closeChoice: 'complete' | 'partial' | null
async function _doSaveGRN(poNumber, intent, closeChoice, fields) {
  showLoading('Saving GRN...');
  try {
    const res = await callAPI('receivefabric', {
      poNumber       : poNumber,
      receivedQty    : fields.receivedQty,
      batchNumber    : fields.batchNumber,
      dyeLot         : fields.dyeLot,
      qualityStatus  : fields.qualityStatus,
      storageLocation: fields.storageLocation,
      notes          : fields.notes
    });

    if (!res.success) {
      toast('Error: ' + res.error, 'error');
      return;
    }

    const d = res.data;

    // If user chose to close the PO, call closePO now
    if (closeChoice === 'complete') {
      const closeRes = await callAPI('closePO', { poNumber });
      if (closeRes.success) {
        toast(
          `GRN ${d.grnNumber} saved. PO ${poNumber} marked as Completed. ✓`,
          'success', 5000
        );
      } else {
        // GRN saved but PO close failed — warn but don't block
        toast(
          `GRN ${d.grnNumber} saved. Could not close PO: ${closeRes.error}`,
          'warning', 5000
        );
      }
    } else if (intent === 'over') {
      toast(
        `GRN ${d.grnNumber} saved. ⚠️ Over-received by ${fmtNum(d.excessQty)} units. PO: Over Received.`,
        'warning', 5000
      );
    } else if (closeChoice === 'partial') {
      toast(
        `GRN ${d.grnNumber} saved. PO kept open as Partial. Receive balance later. ✓`,
        'success', 4000
      );
    } else {
      // Exact receive
      toast(
        `GRN ${d.grnNumber} saved! Stock: ${d.previousStock} → ${d.updatedStock}. PO Completed ✓`,
        'success', 4000
      );
    }

    await loadFabricReceiving();

  } catch(e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    hideLoading();
  }
}

function renderInvRows(items) {
  if(!items||!items.length) return '<tr><td colspan="14" class="table-empty">No inventory items</td></tr>';
  return items.map(inv=>{
    const cur=parseFloat(inv.Current_Stock)||0,reorder=parseFloat(inv.Reorder_Level)||0;
    const pct=reorder>0?Math.min(100,Math.round((cur/reorder)*100)):100;
    const cls=cur<=reorder?'low':cur<=reorder*1.5?'med':'high';
    return `<tr>
      <td class="mono fs-sm">${inv.Inventory_ID}</td><td class="fs-sm">${inv.Article_Number||'—'}</td>
      <td class="fw-600">${inv.Fabric_Name}</td><td>${inv.Color}</td>
      <td class="fs-sm">${inv.Width} ${inv.Width_Unit}</td><td class="fs-sm">${inv.Vendor_Name}</td>
      <td class="fs-sm">${inv.Unit}</td><td class="fs-sm">${fmtNum(inv.Opening_Stock)}</td>
      <td><div class="fw-bold ${cur<=reorder?'text-danger':''}">${fmtNum(cur)}</div>
          <div class="stock-bar-wrap"><div class="stock-bar ${cls}" style="width:${pct}%"></div></div></td>
      <td class="fs-sm">${fmtNum(reorder)}</td>
      <td class="fs-sm ellipsis" style="max-width:100px">${inv.Storage_Location||'—'}</td>
      <td><span class="badge ${inv.Status==='Active'?'badge-success':'badge-secondary'}">${inv.Status}</span>
          ${cur<=reorder?'<span class="badge badge-danger" style="margin-left:3px">LOW</span>':''}</td>
      <td class="fs-sm">${fmtDate(inv.Last_Updated)}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-xs btn-outline" onclick="viewInventoryItem('${inv.Inventory_ID}')">View</button>
        <button class="btn btn-xs btn-primary" onclick="showIssueStockModal('${inv.Inventory_ID}')">Issue</button>
      </td>
    </tr>`;
  }).join('');
}

function filterInventory() {
  const q=(document.getElementById('invSearch').value||'').toLowerCase();
  const vendor=(document.getElementById('invVendor').value||'').toLowerCase();
  const stockF=document.getElementById('invStockFilter').value;
  const filtered=(state.inventory||[]).filter(inv=>{
    if(q&&!`${inv.Article_Number} ${inv.Fabric_Name} ${inv.Color}`.toLowerCase().includes(q)) return false;
    if(vendor&&!inv.Vendor_Name.toLowerCase().includes(vendor)) return false;
    const cur=parseFloat(inv.Current_Stock)||0,reorder=parseFloat(inv.Reorder_Level)||0;
    if(stockF==='low'&&cur>reorder) return false;
    if(stockF==='ok'&&cur<=reorder) return false;
    return true;
  });
  document.getElementById('invTableBody').innerHTML=renderInvRows(filtered);
}

  ['invSearch','invVendor','invStockFilter'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});

  ]);

}

function updateIssueStockInfo(invId) {
  const inv=state.inventory.find(i=>i.Inventory_ID===invId);
  const el=document.getElementById('issStockInfo');
  if(inv&&el){
    el.style.display='block';
    el.innerHTML=`<strong>Available: ${fmtNum(inv.Current_Stock)} ${inv.Unit}</strong> &nbsp;|&nbsp; Reorder: ${fmtNum(inv.Reorder_Level)} | Location: ${inv.Storage_Location||'—'}`;
    const qe=document.getElementById('iss_qty'); if(qe) qe.max=inv.Current_Stock;
  }
}

async function submitIssueStock() {
  const invId=document.getElementById('iss_inv').value;
  const dept=document.getElementById('iss_dept').value;
  if(!invId||!dept){toast('Select item and department','warning');return;}
  showLoading('Issuing stock...');
  try{
    const res=await callAPI('issueStock',{
      inventoryId:invId,issueQty:document.getElementById('iss_qty').value,
      department:dept,productionOrder:document.getElementById('iss_prod').value,
      batchNumber:document.getElementById('iss_batch').value,notes:document.getElementById('iss_notes').value
    });
    if(res.success){
      const d=res.data;
      toast('Issued '+d.issuedQty+' units. Stock: '+d.previousStock+' → '+d.currentStock+(d.lowStockAlert?' ⚠️ Low!':''),d.lowStockAlert?'warning':'success');
      closeModal();await loadStockIssue();
    }else toast('Error: '+res.error,'error');
  }catch(e){toast('Error: '+e.message,'error');}
  finally{hideLoading();}
}

      </div>

async function submitChangePassword() {
  const cur=document.getElementById('cpCurrent').value;
  const newPw=document.getElementById('cpNew').value;
  const confirm=document.getElementById('cpConfirm').value;
  const errEl=document.getElementById('cpError');
  errEl.style.display='none';
  if(!cur||!newPw||!confirm){errEl.textContent='All fields are required.';errEl.style.display='block';return;}
  if(newPw!==confirm){errEl.textContent='Passwords do not match.';errEl.style.display='block';return;}
  if(newPw.length<6){errEl.textContent='Password must be at least 6 characters.';errEl.style.display='block';return;}
  showLoading('Updating...');
  try{
    const res=await callAPI('changePassword',{currentPassword:cur,newPassword:newPw,confirmPassword:confirm});
    if(res.success){toast('Password updated! Please log in again.','success',3000);['cpCurrent','cpNew','cpConfirm'].forEach(id=>document.getElementById(id).value='');}
    else{errEl.textContent=res.error||'Failed.';errEl.style.display='block';}
  }catch(e){errEl.textContent=e.message;errEl.style.display='block';}
  finally{hideLoading();}
}

      <table class="table" id="usersTable">

  state._allUsers = users;

function renderUserRows(users) {
  if (!users || !users.length)
    return '<tr><td colspan="7" class="table-empty">No users found</td></tr>';

  const roleColors = {Admin:'#FF8608',Manager:'#0e9f6e',EntryOP:'#3182ce',User:'#9f7aea',PC:'#e53e3e'};
  const session    = getSession();

  return users.map(u => {
    const isMe    = u.username === session.username;
    const color   = roleColors[u.role] || '#718096';
    const initial = (u.displayName || u.username)[0].toUpperCase();

    return `<tr style="${!u.active?'opacity:0.55':''}">
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:30px;height:30px;border-radius:50%;background:${color};color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${initial}</div>
          <div>
            <div class="fw-600 fs-sm mono">${u.username}</div>
            ${isMe?'<div style="font-size:.65rem;color:var(--primary)">● You</div>':''}
          </div>
        </div>
      </td>
      <td class="fw-500">${u.displayName}</td>
      <td><span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${u.role}</span></td>
      <td><span class="badge ${u.active?'badge-success':'badge-danger'}">${u.active?'Active':'Inactive'}</span></td>
      <td class="fs-sm text-muted">${fmtDate(u.createdAt)}</td>
      <td class="fs-sm text-muted">${u.updatedAt?fmtDate(u.updatedAt):'—'}</td>
      <td>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn btn-xs btn-outline" onclick="showEditUserModal('${u.username}','${u.displayName}','${u.role}')">✏️ Edit</button>
          <button class="btn btn-xs btn-warning" onclick="showResetPasswordModal('${u.username}','${u.displayName}')">🔑 Reset PW</button>
          ${u.active
            ? `<button class="btn btn-xs btn-danger" onclick="confirmDeactivate('${u.username}','${u.displayName}')" ${isMe?'disabled title="Cannot deactivate yourself"':''}>🚫 Deactivate</button>`
            : `<button class="btn btn-xs btn-success" onclick="confirmReactivate('${u.username}','${u.displayName}')">✅ Reactivate</button>`
          }
        </div>
      </td>
    </tr>`;
  }).join('');
}

function filterUsersTable() {
  const q    = (document.getElementById('userSearchInput').value||'').toLowerCase();
  const role = document.getElementById('userRoleFilter').value;
  const filtered = (state._allUsers||[]).filter(u => {
    if (role && u.role !== role) return false;
    if (q && !`${u.username} ${u.displayName}`.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('usersTableBody').innerHTML = renderUserRows(filtered);
}

async function submitAddUser() {
  const username    = (document.getElementById('au_username').value||'').trim().toLowerCase();
  const displayName = (document.getElementById('au_displayName').value||'').trim();
  const role        = document.getElementById('au_role').value;
  const password    = document.getElementById('au_password').value;
  const confirm     = document.getElementById('au_confirm').value;
  const errEl       = document.getElementById('auError');
  errEl.style.display = 'none';

  if (!username || !displayName || !role || !password || !confirm) {
    errEl.textContent = 'All fields are required.'; errEl.style.display = 'block'; return;
  }
  if (!/^[a-z0-9_]{3,30}$/.test(username)) {
    errEl.textContent = 'Username: 3-30 chars, lowercase letters/numbers/underscore only.'; errEl.style.display = 'block'; return;
  }
  if (password.length < 6) {
    errEl.textContent = 'Password must be at least 6 characters.'; errEl.style.display = 'block'; return;
  }
  if (password !== confirm) {
    errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return;
  }

  showLoading('Creating user...');
  try {
    const res = await callAPI('addUser', { username, displayName, role, password });
    if (res.success) {
      toast('User "' + username + '" created successfully!', 'success');
      closeModal();
      await loadUserManagement();
    } else {
      errEl.textContent = res.error || 'Failed to create user.';
      errEl.style.display = 'block';
    }
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    hideLoading();
  }
}

let searchTimer;
async function handleSearch(query) {
  clearTimeout(searchTimer);
  const el=document.getElementById('searchResults');
  if(!query||query.length<2){el.style.display='none';return;}
  searchTimer=setTimeout(async()=>{
    try{
      const res=await callAPI('search',{query}); const results=res.data||[];
      if(!results.length){el.style.display='none';return;}
      el.innerHTML=results.map(r=>`<div class="search-result-item" onclick="handleSearchClick('${r.type}','${r.id}')">
        <div class="result-type">${r.type}</div><div class="result-label">${r.label}</div><div class="result-meta">${r.meta}</div>
      </div>`).join('');
      el.style.display='block';
    }catch(e){}
  },380);
}

function handleSearchClick(type,id) {
  document.getElementById('searchResults').style.display='none';
  document.getElementById('globalSearch').value='';
  if(type==='PurchaseOrder'){showPage('purchase-orders');setTimeout(()=>viewPO(id),600);}
  if(type==='Inventory'){showPage('inventory');setTimeout(()=>viewInventoryItem(id),600);}
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.topbar-search')) document.getElementById('searchResults').style.display='none';

    sb.classList.toggle('open');
    let overlay=document.getElementById('sidebarOverlay');
    if(!overlay){overlay=document.createElement('div');overlay.id='sidebarOverlay';overlay.className='sidebar-overlay';overlay.onclick=closeMobileSidebar;document.body.appendChild(overlay);}
    overlay.classList.toggle('show',sb.classList.contains('open'));
  } else {
    sb.classList.toggle('collapsed');
    mw.classList.toggle('expanded');
  }
}

function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  const overlay=document.getElementById('sidebarOverlay');
  if(overlay) overlay.classList.remove('show');
}

// ── MODAL ─────────────────────────────────────────────────────
function openModal(title, body, buttons) {
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  const footer=document.getElementById('modalFooter');
  footer.innerHTML=(buttons||[]).map((b,i)=>`<button class="btn ${b.cls}" id="modalBtn${i}">${b.label}</button>`).join('');
  (buttons||[]).forEach((b,i)=>{const el=document.getElementById('modalBtn'+i);if(el)el.addEventListener('click',b.action);});
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>{const f=document.querySelector('#modalBody input:not([disabled]),#modalBody select:not([disabled])');if(f)f.focus();},120);
}

function closeModal(e) {
  if(e&&e.target!==document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') document.getElementById('modalOverlay').classList.remove('open');
});

// ── TOAST ─────────────────────────────────────────────────────
function toast(message,type='info',duration=4000) {
  const icons={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  const container=document.getElementById('toastContainer');
  const div=document.createElement('div');
  div.className='toast '+type;
  div.innerHTML=`<span class="toast-icon">${icons[type]||'ℹ️'}</span><span class="toast-text">${message}</span><span class="toast-close" onclick="this.parentElement.remove()">✕</span>`;
  container.appendChild(div);
  setTimeout(()=>{if(div.parentElement)div.remove();},duration);
}

// ── LOADING ───────────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById('loadingText').textContent=msg||'Loading...';
  document.getElementById('loadingOverlay').classList.add('show');
}
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

// ── FORMATTERS ────────────────────────────────────────────────
function fmtNum(n){return isNaN(parseFloat(n))?'0':parseFloat(n).toLocaleString('en-IN',{maximumFractionDigits:2});}
function fmtDate(d){if(!d)return '—';try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return String(d);}}
function fmtDateTime(d){if(!d)return '—';try{return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return String(d);}}

// ── UTILS ─────────────────────────────────────────────────────
function infoRow(label,value){
  return `<div class="form-group"><div class="form-label">${label}</div>
    <div style="padding:8px 10px;background:var(--bg-surface3);border-radius:var(--radius);font-size:.875rem;color:var(--text-primary)">${value||'—'}</div></div>`;
}

function exportTableToCSV(tableId,filename){
  const table=document.getElementById(tableId);
  if(!table){toast('Table not found','warning');return;}
  const rows=Array.from(table.querySelectorAll('tr'));
  const csv=rows.map(row=>Array.from(row.querySelectorAll('th,td')).map(cell=>'"'+cell.innerText.replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename+'_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();
  toast('CSV exported!','success');
}

const THEME_LIST = [
  { key: 'theme-dark-maroon',   label: '🌑 Dark Maroon',   desc: 'Original dark theme',          preview: ['#450052','#FFDB08','#78004E'] },
  { key: 'theme-ocean-blue',    label: '🌊 Ocean Blue',     desc: 'Clean light blue professional', preview: ['#0c4a6e','#0369a1','#f0f9ff'] },
  { key: 'theme-forest-green',  label: '🌿 Forest Green',   desc: 'Calm and natural',              preview: ['#052e16','#15803d','#f0fdf4'] },
  { key: 'theme-rose-gold',     label: '🌸 Rose Gold',      desc: 'Elegant pink and gold',         preview: ['#4c0519','#be123c','#fff1f2'] },
  { key: 'theme-royal-purple',  label: '👑 Royal Purple',   desc: 'Bold and sophisticated',        preview: ['#1e0533','#6d28d9','#faf5ff'] },
  { key: 'theme-sunset-orange', label: '🌅 Sunset Orange',  desc: 'Warm and energetic',            preview: ['#431407','#c2410c','#fff7ed'] },
  { key: 'theme-clean-white',   label: '🤍 Clean White',    desc: 'Minimal white with color accents', preview: ['#1e293b','#4f46e5','#ffffff'] },
  { key: 'theme-vivid-white', label: '✨ Vivid White', desc: 'All white with colorful text', preview: ['#1d4ed8','#7c3aed','#15803d'] },
];
function applyTheme(themeKey) {
  THEME_LIST.forEach(t => document.body.classList.remove(t.key));
  if (themeKey !== 'theme-dark-maroon') {
    document.body.classList.add(themeKey);
  }
  try { localStorage.setItem('erp_theme', themeKey); } catch(e) {}
  document.querySelectorAll('.theme-option').forEach(el => {
    el.classList.toggle('active', el.dataset.theme === themeKey);
  });
  closeThemePicker();
}

function loadSavedTheme() {
  try {
    const saved = localStorage.getItem('erp_theme') || 'theme-dark-maroon';
    applyTheme(saved);
  } catch(e) {}
}

function openThemePicker() {
  const existing = document.getElementById('themePickerPanel');
  if (existing) { existing.remove(); return; }

  const currentTheme = (() => {
    try { return localStorage.getItem('erp_theme') || 'theme-dark-maroon'; } catch(e) { return 'theme-dark-maroon'; }
  })();

  const panel = document.createElement('div');
  panel.id = 'themePickerPanel';
  panel.style.cssText = `
    position:fixed; top:66px; right:16px; z-index:9999;
    background:#1a1a2e; border:1px solid rgba(255,255,255,0.12);
    border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,0.5);
    padding:16px; width:300px;
  `;
  panel.innerHTML = `
    <div style="font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.08);">🎨 Choose Theme</div>
    <div id="themeOptionsList"></div>
    <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);font-size:11px;color:#64748b;text-align:center;">Theme is saved automatically</div>
  `;
  document.body.appendChild(panel);

  const list = document.getElementById('themeOptionsList');
  THEME_LIST.forEach(t => {
    const opt = document.createElement('div');
    opt.className = 'theme-option' + (t.key === currentTheme ? ' active' : '');
    opt.dataset.theme = t.key;
    opt.onclick = () => applyTheme(t.key);
    opt.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;border:2px solid ' + (t.key === currentTheme ? 'rgba(255,255,255,0.2)' : 'transparent') + ';margin-bottom:4px;';
    opt.onmouseover = () => { opt.style.background = 'rgba(255,255,255,0.06)'; };
    opt.onmouseout  = () => { opt.style.background = t.key === currentTheme ? 'rgba(255,255,255,0.08)' : ''; };
    opt.innerHTML = `
      <div style="display:flex;gap:3px;flex-shrink:0">
        ${t.preview.map(c => `<div style="width:14px;height:14px;border-radius:50%;background:${c};border:1px solid rgba(255,255,255,0.15)"></div>`).join('')}
      </div>
      <div>
        <div style="font-size:13px;font-weight:600;color:#f1f5f9">${t.label}</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:1px">${t.desc}</div>
      </div>
      ${t.key === currentTheme ? '<div style="margin-left:auto;color:#10b981;font-weight:700">✓</div>' : ''}
    `;
    list.appendChild(opt);
  });

  setTimeout(() => {
    document.addEventListener('click', function outside(e) {
      if (!panel.contains(e.target) && e.target.id !== 'themeToggleBtn') {
        panel.remove();
        document.removeEventListener('click', outside);
      }
    });
  }, 100);
}

function closeThemePicker() {
  const p = document.getElementById('themePickerPanel');
  if (p) p.remove();
}

function addThemeButtonToTopbar() {
  const topbarRight = document.querySelector('.topbar-right');
  if (!topbarRight || document.getElementById('themeToggleBtn')) return;
  const btn = document.createElement('button');
  btn.id = 'themeToggleBtn';
  btn.title = 'Change Theme';
  btn.innerHTML = '🎨';
  btn.style.cssText = 'background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#f1f5f9;padding:6px 10px;font-size:16px;cursor:pointer;flex-shrink:0;';

}

function buildColorRows(colors) {
  return (colors || []).map((c, i) => colorRowHtml(i, c.color, c.qty)).join('');

function colorRowHtml(i, colorVal, qtyVal) {
  return `<div class="color-row" id="colorRow${i}" style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
    <input type="text"   class="form-control" placeholder="Color name" value="${colorVal || ''}"
           style="flex:1" oninput="syncColorRows()">
    <input type="number" class="form-control" placeholder="Qty" value="${qtyVal !== undefined ? qtyVal : ''}"
           style="width:100px" min="0" oninput="syncColorRows()">
    <button type="button" class="btn btn-xs btn-danger" onclick="removeColorRow(this)" title="Remove">✕</button>
  </div>`;
}

let _colorRowCount = 0;
function addColorRow() {
  _colorRowCount++;
  const wrap = document.getElementById('colorRowsWrap');
  const div  = document.createElement('div');
  div.innerHTML = colorRowHtml(_colorRowCount, '', '');
  wrap.appendChild(div.firstElementChild);
}

function removeColorRow(btn) {
  const row = btn.closest('.color-row');
  if (document.querySelectorAll('#colorRowsWrap .color-row').length <= 1) {
    toast('At least one color is required', 'error'); return;
  }
  row.remove();
}

function syncColorRows() { /* no-op — values read live on submit */ }

function readColorRows() {
  const rows = document.querySelectorAll('#colorRowsWrap .color-row');
  const colors = [];
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    colors.push({ color: inputs[0].value.trim(), qty: inputs[1].value });
  });
  return colors;
}

// ── Color row helpers ────────────────────────────────────────
let _crCount = 0;

function _colorRowHtml(idx, colorVal, qtyVal) {
  return `<div class="color-row" id="cr${idx}"
    style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
    <input type="text" class="form-control" placeholder="Color name"
      value="${colorVal || ''}" style="flex:1">
    <input type="number" class="form-control" placeholder="Qty"
      value="${qtyVal !== undefined && qtyVal !== '' ? qtyVal : ''}"
      style="width:100px" min="0">
    <button type="button" class="btn btn-xs btn-danger"
      onclick="_removeColorRow(this)" title="Remove">✕</button>
  </div>`;
}

function _addColorRow() {
  _crCount++;
  const wrap = document.getElementById('colorRowsWrap');
  const div  = document.createElement('div');
  div.innerHTML = _colorRowHtml(_crCount, '', '');
  wrap.appendChild(div.firstElementChild);
}

function _removeColorRow(btn) {
  if (document.querySelectorAll('#colorRowsWrap .color-row').length <= 1) {
    toast('At least one color is required', 'error'); return;
  }
  btn.closest('.color-row').remove();
}

function _readColorRows() {
  const colors = [];
  document.querySelectorAll('#colorRowsWrap .color-row').forEach(row => {
    const inputs = row.querySelectorAll('input');
    colors.push({ color: (inputs[0].value || '').trim(), qty: inputs[1].value });
  });
  return colors;
}

function _buildColorRows(colors) {
  return (colors || [{ color: '', qty: '' }]).map((c, i) =>
    _colorRowHtml(i, c.color, c.qty)
  ).join('');
}

function _filterSOTable() {
  const q      = (document.getElementById('soSearch').value || '').toLowerCase();
  const status = document.getElementById('soStatusFilter').value;
  document.querySelectorAll('#soTableBody tr[data-so]').forEach(tr => {
    const mQ = !q || tr.dataset.so.includes(q) || tr.dataset.cust.includes(q);
    const mS = !status || tr.dataset.status === status;
    tr.style.display = (mQ && mS) ? '' : 'none';
  });
}

        <label class="form-label" style="font-size:.75rem">Qty *</label>

          placeholder="0" min="1" oninput="_calcSOTotals()">
      </div>
      <div class="form-group" style="margin-bottom:4px">
        <label class="form-label" style="font-size:.75rem">Rate Per Piece (₹) *</label>

          placeholder="0.00" min="0" step="0.01" oninput="_calcSOTotals()">

      <span>Net: <strong id="soLiN${idx}" style="color:var(--success-light)">₹0</strong></span>
    </div>
  </div>`;

function _addSOLineItem() {
  _soLiIdx++;
  const wrap = document.getElementById('soLineItemsWrap');
  if (!wrap) return;
  const div = document.createElement('div');
  div.innerHTML = _soLineItemHtml(_soLiIdx);
  wrap.appendChild(div.firstElementChild);
}

function _removeSOLineItem(idx) {
  if (document.querySelectorAll('.so-li-card').length <= 1) {
    toast('At least one line item is required', 'error'); return;
  }
  const el = document.getElementById('soLI' + idx);
  if (el) el.remove();
  _calcSOTotals();
}

function _onArtChange(idx) {
  const sel    = document.getElementById('soArt' + idx);
  const opt    = sel.options[sel.selectedIndex];
  let colors   = [];
  try { colors = JSON.parse(opt.dataset.colors || '[]'); } catch(e) {}
  const cs = document.getElementById('soColor' + idx);
  cs.innerHTML = colors.length
    ? colors.map(c => `<option value="${c.color}">${c.color}</option>`).join('')
    : '<option value="">No colors for this article</option>';
}

function _calcSOTotals() {
  let gTotal = 0, dTotal = 0, nTotal = 0;
  document.querySelectorAll('.so-li-card').forEach(card => {
    const id   = card.id.replace('soLI', '');
    const qty  = parseFloat(document.getElementById('soQty'  + id)?.value) || 0;
    const rate = parseFloat(document.getElementById('soRate' + id)?.value) || 0;
    const disc = parseFloat(document.getElementById('soDisc' + id)?.value) || 0;
    const g    = qty * rate;
    const d    = g * disc / 100;
    const n    = g - d;
    gTotal += g; dTotal += d; nTotal += n;
    const gEl = document.getElementById('soLiG' + id);
    const dEl = document.getElementById('soLiD' + id);
    const nEl = document.getElementById('soLiN' + id);
    if (gEl) gEl.textContent = '₹' + g.toFixed(2);
    if (dEl) dEl.textContent = '₹' + d.toFixed(2);
    if (nEl) nEl.textContent = '₹' + n.toFixed(2);
  });
  const gD = document.getElementById('soGrossDisp');
  const dD = document.getElementById('soDiscDisp');
  const nD = document.getElementById('soNetDisp');
  if (gD) gD.textContent = '₹' + gTotal.toFixed(2);
  if (dD) dD.textContent = '₹' + dTotal.toFixed(2);
  if (nD) nD.textContent = '₹' + nTotal.toFixed(2);
}

async function _submitCreateSO() {
  const customerId = document.getElementById('soCustomerSel').value;
  if (!customerId) { toast('Please select a customer', 'error'); return; }

  const lineItems = [];
  let valid = true;

  document.querySelectorAll('.so-li-card').forEach(card => {
    if (!valid) return;
    const id     = card.id.replace('soLI', '');
    const artSel = document.getElementById('soArt'   + id);
    const colSel = document.getElementById('soColor' + id);
    const sizSel = document.getElementById('soSize'  + id);
    const qty    = document.getElementById('soQty'   + id)?.value;
    const rate   = document.getElementById('soRate'  + id)?.value;
    const disc   = document.getElementById('soDisc'  + id)?.value || '0';
    if (!artSel?.value || !colSel?.value || !sizSel?.value || !qty || !rate) {
      toast('Please fill all required fields (*) in every line item', 'error');
      valid = false; return;
    }
    lineItems.push({
      articleId    : artSel.value,
      articleNumber: artSel.options[artSel.selectedIndex]?.text || '',
      color        : colSel.value,
      size         : sizSel.value,
      qty, ratePerPiece: rate, discountPct: disc
    });
  });

  if (!valid || lineItems.length === 0) return;

  showLoading('Creating Sales Order...');
  const res = await callAPI('createSalesOrder', {
    customerId,
    lineItems,
    notes: document.getElementById('soNotes')?.value || ''
  });
  hideLoading();
  if (res.success) {
    toast(res.message || 'Sales Order created', 'success');
    closeModal();
    loadSalesOrders();
  } else {
    toast('Error: ' + res.error, 'error');
  }
}

    </div>

    <div style="overflow-x:auto;margin-bottom:16px">

            <th style="padding:7px 5px;text-align:left">Article</th>

              font-weight:700;color:#dc2626">
              ₹${fmtNum(o.Total_Discount)}
            </td>

// ── Update SO Status ─────────────────────────────────────────
function _showUpdateSOStatus(soId, currentStatus) {
  openModal('Update SO Status', `
    <div style="text-align:center;padding:12px 0">
      <div style="font-size:.88rem;margin-bottom:16px">
        Sales Order <strong>${soId}</strong><br>
        Current: <span class="badge ${currentStatus==='Dispatched'
          ?'badge-success':'badge-warning'}">${currentStatus}</span>
      </div>
      <div style="display:flex;gap:12px;justify-content:center">
        <button class="btn btn-outline" style="min-width:120px"
          onclick="document.getElementById('soNewSt').value='Pending'">
          ⏳ Pending
        </button>
        <button class="btn btn-success" style="min-width:120px"
          onclick="document.getElementById('soNewSt').value='Dispatched'">
          🚚 Dispatched
        </button>
      </div>
      <input type="hidden" id="soNewSt" value="${currentStatus}">
      <div style="margin-top:10px;font-size:.8rem;color:var(--text-muted)">
        Click a status above, then click Update.
      </div>
    </div>
  `, [
    { label: 'Cancel',        cls: 'btn-outline', action: closeModal },
    { label: 'Update Status', cls: 'btn-primary',  action: async () => {
      const newStatus = document.getElementById('soNewSt').value;
      showLoading('Updating...');
      const res = await callAPI('updateSOStatus', { soId, status: newStatus });
      hideLoading();
      if (res.success) {
        toast('Status updated to ' + newStatus, 'success');
        closeModal();
        loadSalesOrders();
      } else {
        toast('Error: ' + res.error, 'error');
      }
    }}
  ]);
}

// ── Delete SO ────────────────────────────────────────────────
async function _deleteSO(soId) {
  if (!confirm('Delete Sales Order ' + soId + '?\n\nThis cannot be undone.')) return;
  showLoading('Deleting...');
  const res = await callAPI('deleteSalesOrder', { soId });
  hideLoading();
  if (res.success) { toast('Sales Order deleted', 'success'); loadSalesOrders(); }
  else toast('Error: ' + res.error, 'error');
}

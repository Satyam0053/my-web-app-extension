<script>
// ============================================================
// ReturnUI.html — Returns Management (Sprint S10)
// ============================================================

function renderReturns() {
  setPageTitle('Returns');
  document.getElementById('pageContent').innerHTML = `
    <div class="page-header">
      <div><h1 class="page-title">Returns</h1><p class="page-subtitle">Manage customer, fabric and fabricator returns</p></div>
      <button class="btn btn-primary" onclick="openCreateReturnModal()">+ New Return</button>
    </div>
    <div class="page-toolbar">
      <div class="toolbar-left">
        <input type="text" class="search-input" placeholder="Search returns…" oninput="filterTable('ret-table',this.value)">
        <select class="filter-select" id="ret-type-filter" onchange="loadReturns()">
          <option value="">All Types</option>
          <option value="Customer Return">Customer Return</option>
          <option value="Fabric Return">Fabric Return</option>
          <option value="Fabricator Return">Fabricator Return</option>
        </select>
        <select class="filter-select" id="ret-status-filter" onchange="loadReturns()">
          <option value="">All Statuses</option>
          <option value="Open">Open</option>
          <option value="Processed">Processed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
    </div>
    <div id="ret-table-wrap"><div class="loading-spinner"></div></div>
  `;
  loadReturns();
}

function loadReturns() {
  var filters = {};
  var type   = (document.getElementById('ret-type-filter')   || {}).value;
  var status = (document.getElementById('ret-status-filter') || {}).value;
  if (type)   filters.returnType = type;
  if (status) filters.status     = status;
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error','Error',res.message); return; }
      renderReturnTable(res.data);
    })
    .withFailureHandler(function(e) { showToast('error','Error',e.message); })
    .serverGetReturns(ERP.token, filters);
}

function renderReturnTable(rows) {
  var wrap = document.getElementById('ret-table-wrap');
  if (!rows || rows.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><span class="empty-icon">↩️</span><p>No returns found.</p></div>';
    return;
  }
  renderDataTable({
    containerId: 'ret-table-wrap', tableId: 'ret-table',
    columns: [
      { label: 'Return ID',   key: 'ReturnID',       render: function(v) { return '<code class="mono-sm">'+v+'</code>'; } },
      { label: 'Date',        key: 'ReturnDate',     render: fmtDate },
      { label: 'Type',        key: 'ReturnType',     render: function(v) {
        var icons = { 'Customer Return':'👕','Fabric Return':'🧵','Fabricator Return':'🏭' };
        return '<span class="badge badge-blue">'+(icons[v]||'')+' '+escHtml(v)+'</span>';
      }},
      { label: 'Reference',   key: 'ReferenceName',  render: function(v) { return escHtml(v||'—'); } },
      { label: 'Reason',      key: 'Reason',         render: function(v) { return escHtml((v||'').substring(0,40)); } },
      { label: 'Status',      key: 'Status',         render: statusBadge },
      { label: '',            key: '_a',             render: function(_, r) {
        var btns = '<button class="btn btn-xs btn-outline" onclick="viewReturn(\''+r.ReturnID+'\')">View</button>';
        if (r.Status === 'Open') {
          btns += ' <button class="btn btn-xs btn-success" onclick="processReturn(\''+r.ReturnID+'\')">Process</button>';
          btns += ' <button class="btn btn-xs btn-danger" onclick="cancelReturn(\''+r.ReturnID+'\')">Cancel</button>';
        }
        return btns;
      }}
    ], data: rows
  });
}

function viewReturn(returnID) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error','Error',res.message); return; }
      var r = res.data;
      var itemRows = (r.Items||[]).map(function(i) {
        return '<tr><td>'+escHtml(i.FabricName||'—')+'</td><td>'+escHtml(i.ColorName||'—')+'</td><td>'+escHtml(i.BundleID||'—')+'</td><td>'+fmtNum(i.Qty)+'</td><td>'+escHtml(i.UOM)+'</td><td>'+escHtml(i.Remarks||'—')+'</td></tr>';
      }).join('');
      var body = `
        <div class="detail-grid">
          <div class="detail-item"><span class="detail-label">Return ID</span><span class="detail-value mono-sm">${r.ReturnID}</span></div>
          <div class="detail-item"><span class="detail-label">Type</span><span class="detail-value">${escHtml(r.ReturnType)}</span></div>
          <div class="detail-item"><span class="detail-label">Date</span><span class="detail-value">${fmtDate(r.ReturnDate)}</span></div>
          <div class="detail-item"><span class="detail-label">Reference</span><span class="detail-value">${escHtml(r.ReferenceName||'—')}</span></div>
          <div class="detail-item"><span class="detail-label">Status</span><span class="detail-value">${statusBadge(r.Status)}</span></div>
          <div class="detail-item"><span class="detail-label">Reason</span><span class="detail-value">${escHtml(r.Reason||'—')}</span></div>
        </div>
        <div class="section-divider">Items (${(r.Items||[]).length})</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Fabric</th><th>Color</th><th>Bundle</th><th>Qty</th><th>UOM</th><th>Remarks</th></tr></thead><tbody>${itemRows}</tbody></table></div>
      `;
      var footer = '';
      if (r.Status === 'Open') {
        footer = '<button class="btn btn-success btn-sm" onclick="closeModal();processReturn(\''+r.ReturnID+'\')">Process</button> <button class="btn btn-danger btn-sm" onclick="closeModal();cancelReturn(\''+r.ReturnID+'\')">Cancel</button> ';
      }
      footer += '<button class="btn btn-ghost" onclick="closeModal()">Close</button>';
      openModal('Return — '+r.ReturnID, body, footer, 'lg');
    })
    .withFailureHandler(function(e) { showToast('error','Error',e.message); })
    .serverGetReturnByID(ERP.token, returnID);
}

function processReturn(returnID) {
  showConfirm('Mark this return as Processed?', function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { showToast('error','Error',res.message); return; }
        showToast('success','Success','Return marked as Processed');
        loadReturns();
      })
      .withFailureHandler(function(e) { showToast('error','Error',e.message); })
      .serverUpdateReturnStatus(ERP.token, returnID, 'Processed');
  });
}

function cancelReturn(returnID) {
  showConfirm('Cancel this return? This cannot be undone.', function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { showToast('error','Error',res.message); return; }
        showToast('success','Success','Return cancelled');
        loadReturns();
      })
      .withFailureHandler(function(e) { showToast('error','Error',e.message); })
      .serverUpdateReturnStatus(ERP.token, returnID, 'Cancelled');
  });
}

function openCreateReturnModal() {
  loadDropdowns(function() {
    var buyers  = (ERP.dropdowns && ERP.dropdowns.buyers)  || [];
    var vendors = (ERP.dropdowns && ERP.dropdowns.vendors) || [];
    var fabrics = (ERP.dropdowns && ERP.dropdowns.fabrics) || [];

    var buyerOpts  = buyers.map(function(b) { return '<option value="'+b.id+'">'+escHtml(b.name)+'</option>'; }).join('');
    var vendorOpts = vendors.map(function(v) { return '<option value="'+v.id+'">'+escHtml(v.name)+'</option>'; }).join('');
    var fabricOpts = fabrics.map(function(f) { return '<option value="'+f.id+'">'+escHtml(f.name)+'</option>'; }).join('');

    var body = `
      <div class="form-row">
        <div class="form-group"><label class="form-label required">Return Type</label>
          <select id="ret-type" class="form-control" onchange="updateReturnRefField()">
            <option value="">— Select Type —</option>
            <option value="Customer Return">Customer Return</option>
            <option value="Fabric Return">Fabric Return to Vendor</option>
            <option value="Fabricator Return">Fabricator Return</option>
          </select></div>
        <div class="form-group"><label class="form-label required">Return Date</label>
          <input type="date" id="ret-date" class="form-control" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div id="ret-ref-wrap" style="display:none">
        <div class="form-group"><label class="form-label" id="ret-ref-label">Reference</label>
          <select id="ret-ref" class="form-control"><option value="">— Select —</option></select></div>
      </div>
      <div class="form-group"><label class="form-label required">Reason</label>
        <textarea id="ret-reason" class="form-control" rows="2" placeholder="Reason for return…"></textarea></div>
      <div class="section-divider">Items</div>
      <div id="ret-item-rows"></div>
      <button class="btn btn-outline btn-sm mt-1" onclick="addReturnItem()">+ Add Item</button>
    `;
    var footer = `
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitReturn()">Create Return</button>
    `;
    openModal('New Return', body, footer, 'lg');
    window._retBuyers  = buyers;
    window._retVendors = vendors;
    window._retFabrics = fabrics;
    window._retItems   = 0;
    addReturnItem();
  });
}

function updateReturnRefField() {
  var type = document.getElementById('ret-type').value;
  var wrap = document.getElementById('ret-ref-wrap');
  var label= document.getElementById('ret-ref-label');
  var sel  = document.getElementById('ret-ref');
  if (!type) { wrap.style.display='none'; return; }
  wrap.style.display = 'block';
  var items = [];
  if (type === 'Customer Return') { label.textContent='Buyer'; items = window._retBuyers || []; }
  else if (type === 'Fabric Return') { label.textContent='Vendor'; items = (window._retVendors||[]).filter(function(v){return v.type!=='Fabricator';}); }
  else { label.textContent='Fabricator'; items = (window._retVendors||[]).filter(function(v){return v.type==='Fabricator'||v.type==='Both';}); }
  sel.innerHTML = '<option value="">— Select —</option>' + items.map(function(i){return '<option value="'+i.id+'">'+escHtml(i.name)+'</option>';}).join('');
}

function addReturnItem() {
  var idx = window._retItems++;
  var fabrics = window._retFabrics || [];
  var fabricOpts = fabrics.map(function(f){return '<option value="'+f.id+'">'+escHtml(f.name)+'</option>';}).join('');
  var div = document.createElement('div');
  div.id = 'ret-item-'+idx;
  div.className = 'form-row'; div.style.alignItems='flex-end';
  div.innerHTML = `
    <div class="form-group"><label class="form-label">Fabric</label>
      <select class="form-control" id="ri-fab-${idx}" onchange="loadReturnColors(${idx})"><option value="">— Fabric —</option>${fabricOpts}</select></div>
    <div class="form-group"><label class="form-label">Color</label>
      <select class="form-control" id="ri-col-${idx}"><option value="">— Color —</option></select></div>
    <div class="form-group" style="max-width:100px"><label class="form-label">Qty</label>
      <input type="number" class="form-control" id="ri-qty-${idx}" min="0.01" step="0.01" placeholder="0"></div>
    <div class="form-group" style="max-width:90px"><label class="form-label">UOM</label>
      <select class="form-control" id="ri-uom-${idx}"><option>Meters</option><option>Yards</option><option>Pcs</option></select></div>
    <button class="btn btn-ghost btn-sm" onclick="document.getElementById('ret-item-${idx}').remove()" style="margin-bottom:6px">✕</button>
  `;
  var container = document.getElementById('ret-item-rows');
  if (container) container.appendChild(div);
}

function loadReturnColors(idx) {
  var fabricID = document.getElementById('ri-fab-'+idx).value;
  var colorSel = document.getElementById('ri-col-'+idx);
  var colors   = ((ERP.dropdowns && ERP.dropdowns.fabricColors) || []).filter(function(c){return c.fabricID===fabricID;});
  colorSel.innerHTML = '<option value="">— Color —</option>' + colors.map(function(c){return '<option value="'+c.id+'">'+escHtml(c.name)+'</option>';}).join('');
}

function submitReturn() {
  var type    = document.getElementById('ret-type').value;
  var date    = document.getElementById('ret-date').value;
  var refSel  = document.getElementById('ret-ref');
  var refID   = refSel ? refSel.value : '';
  var reason  = document.getElementById('ret-reason').value;

  if (!type)   { showToast('error','Error','Select return type'); return; }
  if (!date)   { showToast('error','Error','Date is required'); return; }
  if (!reason) { showToast('error','Error','Reason is required'); return; }

  var items = [];
  document.querySelectorAll('[id^="ri-fab-"]').forEach(function(el) {
    var idx = el.id.replace('ri-fab-','');
    var fabricID  = el.value;
    var colorEl   = document.getElementById('ri-col-'+idx);
    var qtyEl     = document.getElementById('ri-qty-'+idx);
    var uomEl     = document.getElementById('ri-uom-'+idx);
    if (parseFloat((qtyEl||{}).value) > 0) {
      items.push({ FabricID: fabricID||'', FabricColorID: colorEl?colorEl.value:'', Qty: parseFloat(qtyEl.value), UOM: uomEl?uomEl.value:'Meters' });
    }
  });
  if (items.length === 0) { showToast('error','Error','Add at least one item'); return; }

  var data = { ReturnType: type, ReturnDate: date, BuyerID: refID, ReferenceID: refID, Reason: reason, items: items };
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error','Error',res.message); return; }
      showToast('success','Success','Return created: '+res.data.returnID);
      closeModal(); loadReturns();
    })
    .withFailureHandler(function(e) { showToast('error','Error',e.message); })
    .serverCreateReturn(ERP.token, data);
}
</script>

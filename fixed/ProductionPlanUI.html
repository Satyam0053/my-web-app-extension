<!-- ============================================================
     ProductionPlanUI.html — Sprint S6
     Handles: Production Plans list, create, view, bundle generation
     ============================================================ -->
<script>
// ── Page: Production Plans ────────────────────────────────────
function renderProductionPlans() {
  setPageTitle('Production Plans');
  const content = document.getElementById('page-content');
  content.innerHTML = `
    <div class="page-toolbar">
      <div class="toolbar-left">
        <input type="text" id="plan-search" class="search-input" placeholder="Search plans…" oninput="filterTable('plan-table',this.value)">
        <select id="plan-status-filter" class="filter-select" onchange="loadProductionPlans()">
          <option value="">All Statuses</option>
          <option value="Draft">Draft</option>
          <option value="Confirmed">Confirmed</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-primary" onclick="openCreatePlanModal()">+ New Plan</button>
      </div>
    </div>
    <div id="plan-table-wrap"><div class="loading-spinner"></div></div>
  `;
  loadProductionPlans();
}

function loadProductionPlans() {
  const status  = (document.getElementById('plan-status-filter') || {}).value || '';
  const filters = status ? { status } : {};
  google.script.run
    .withSuccessHandler(res => {
      if (!res.success) { showToast(res.message, 'error'); return; }
      renderPlanTable(res.data);
    })
    .withFailureHandler(err => showToast(err.message, 'error'))
    .serverGetProductionPlans(appState.token, filters);
}

function renderPlanTable(plans) {
  const wrap = document.getElementById('plan-table-wrap');
  if (!plans || plans.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><span class="empty-icon">📋</span><p>No production plans found</p></div>`;
    return;
  }
  renderDataTable({
    containerId: 'plan-table-wrap',
    tableId:     'plan-table',
    columns: [
      { label: 'Plan ID',   key: 'PlanID',     render: v => `<code class="mono-sm">${v}</code>` },
      { label: 'SO #',      key: 'SONumber' },
      { label: 'Buyer',     key: 'BuyerName' },
      { label: 'Article',   key: 'ArticleName' },
      { label: 'Style',     key: 'StyleCode' },
      { label: 'Pieces',    key: 'TotalPieces', render: v => fmtNum(v) },
      { label: 'Bundle Sz', key: 'BundleSize' },
      { label: 'Start',     key: 'PlannedStartDate', render: fmtDate },
      { label: 'End',       key: 'PlannedEndDate',   render: fmtDate },
      { label: 'Status',    key: 'Status', render: v => statusBadge(v) },
      { label: 'Actions',   key: '_actions', render: (_, row) =>
        `<button class="btn btn-sm btn-outline" onclick="viewProductionPlan('${row.PlanID}')">View</button>`
      }
    ],
    data: plans
  });
}

// ── Create Production Plan Modal ──────────────────────────────
function openCreatePlanModal() {
  const body = `
    <div class="form-group">
      <label class="form-label required">Sales Order</label>
      <select id="cp-so" class="form-control" onchange="loadSOBreakdown(this.value)">
        <option value="">— Select SO —</option>
      </select>
    </div>
    <div id="cp-article-wrap" style="display:none">
      <div class="form-group">
        <label class="form-label required">Article</label>
        <select id="cp-article" class="form-control">
          <option value="">— Select Article —</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label required">Planned Start</label>
        <input type="date" id="cp-start" class="form-control">
      </div>
      <div class="form-group">
        <label class="form-label required">Planned End</label>
        <input type="date" id="cp-end" class="form-control">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label required">Bundle Size (pieces per bundle)</label>
      <input type="number" id="cp-bsize" class="form-control" value="12" min="1" max="100">
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <textarea id="cp-notes" class="form-control" rows="2"></textarea>
    </div>
  `;
  const footer = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="submitCreatePlan()">Create Plan</button>
  `;
  openModal('New Production Plan', body, footer, 'md');
  // Populate SO dropdown
  populateDropdown('cp-so', appState.dropdowns.salesOrders || []);
}

function loadSOBreakdown(soID) {
  const wrap = document.getElementById('cp-article-wrap');
  if (!soID) { wrap.style.display = 'none'; return; }
  google.script.run
    .withSuccessHandler(res => {
      if (!res.success) { showToast(res.message, 'error'); return; }
      const sel = document.getElementById('cp-article');
      sel.innerHTML = '<option value="">— Select Article —</option>';
      (res.data.articles || []).forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.ArticleID;
        opt.textContent = `${a.ArticleName} (${a.StyleCode}) — ${fmtNum(a.TotalPieces)} pcs`;
        sel.appendChild(opt);
      });
      wrap.style.display = 'block';
    })
    .withFailureHandler(err => showToast(err.message, 'error'))
    .serverGetSOArticleBreakdown(appState.token, soID);
}

function submitCreatePlan() {
  const payload = {
    SOID:             document.getElementById('cp-so').value,
    ArticleID:        document.getElementById('cp-article').value,
    PlannedStartDate: document.getElementById('cp-start').value,
    PlannedEndDate:   document.getElementById('cp-end').value,
    BundleSize:       document.getElementById('cp-bsize').value,
    Notes:            document.getElementById('cp-notes').value
  };
  if (!payload.SOID || !payload.ArticleID || !payload.PlannedStartDate ||
      !payload.PlannedEndDate || !payload.BundleSize) {
    showToast('Please fill all required fields', 'error'); return;
  }
  google.script.run
    .withSuccessHandler(res => {
      if (!res.success) { showToast(res.message, 'error'); return; }
      showToast('Production plan created', 'success');
      closeModal();
      loadProductionPlans();
    })
    .withFailureHandler(err => showToast(err.message, 'error'))
    .serverCreateProductionPlan(appState.token, payload);
}

// ── View Production Plan ──────────────────────────────────────
function viewProductionPlan(planID) {
  google.script.run
    .withSuccessHandler(res => {
      if (!res.success) { showToast(res.message, 'error'); return; }
      showPlanDetailModal(res.data);
    })
    .withFailureHandler(err => showToast(err.message, 'error'))
    .serverGetProductionPlanByID(appState.token, planID);
}

function showPlanDetailModal(plan) {
  const bundlesByStatus = plan.BundlesByStatus || {};
  const transitions = {
    Draft:       ['Confirmed', 'Cancelled'],
    Confirmed:   ['In Progress', 'Cancelled'],
    'In Progress': ['Completed'],
    Completed:   [],
    Cancelled:   []
  };
  const allowed = transitions[plan.Status] || [];

  const transitionBtns = allowed.map(s => {
    const cls = s === 'Cancelled' ? 'btn-danger' : s === 'Confirmed' ? 'btn-success' : 'btn-primary';
    return `<button class="btn btn-sm ${cls}" onclick="changePlanStatus('${plan.PlanID}','${s}')">${s}</button>`;
  }).join(' ');

  const genBtn = ['Draft','Confirmed'].includes(plan.Status)
    ? `<button class="btn btn-sm btn-secondary" onclick="generatePlanBundles('${plan.PlanID}')">⚡ Generate Bundles</button>`
    : '';
  const printBtn = (plan.Bundles||[]).length > 0
    ? `<button class="btn btn-sm btn-outline" onclick="printBundleLabels('${plan.PlanID}')">🏷️ Print Labels</button>`
    : '';
  const resetBtn = ['Draft','Confirmed'].includes(plan.Status) && (plan.Bundles||[]).length > 0
    ? `<button class="btn btn-sm btn-ghost" onclick="resetPlanBundles('${plan.PlanID}')">🗑 Reset Bundles</button>`
    : '';

  const bundleRows = (plan.Bundles || []).slice(0, 20).map(b => `
    <tr>
      <td>${b.BundleNumber}</td>
      <td><code class="mono-sm">${b.BarcodeValue}</code></td>
      <td>${escHtml(b.Size)}</td>
      <td>${escHtml(b.Color || '—')}</td>
      <td>${fmtNum(b.Pieces)}</td>
      <td>${statusBadge(b.CuttingStatus)}</td>
      <td>${statusBadge(b.StitchingStatus)}</td>
      <td>${statusBadge(b.FinishingStatus)}</td>
      <td>${statusBadge(b.PackingStatus)}</td>
      <td><button class="btn btn-xs btn-outline" onclick="viewBundle('${b.BundleID}')">View</button></td>
    </tr>
  `).join('');

  const moreCount = (plan.Bundles||[]).length - 20;

  const body = `
    <div class="detail-grid">
      <div class="detail-item"><span class="detail-label">Plan ID</span><span class="detail-value mono-sm">${plan.PlanID}</span></div>
      <div class="detail-item"><span class="detail-label">Status</span><span class="detail-value">${statusBadge(plan.Status)}</span></div>
      <div class="detail-item"><span class="detail-label">Sales Order</span><span class="detail-value">${escHtml(plan.SONumber)}</span></div>
      <div class="detail-item"><span class="detail-label">Buyer</span><span class="detail-value">${escHtml(plan.BuyerName)}</span></div>
      <div class="detail-item"><span class="detail-label">Article</span><span class="detail-value">${escHtml(plan.ArticleName)}</span></div>
      <div class="detail-item"><span class="detail-label">Style Code</span><span class="detail-value">${escHtml(plan.StyleCode)}</span></div>
      <div class="detail-item"><span class="detail-label">Total Pieces</span><span class="detail-value">${fmtNum(plan.TotalPieces)}</span></div>
      <div class="detail-item"><span class="detail-label">Bundle Size</span><span class="detail-value">${plan.BundleSize} pcs</span></div>
      <div class="detail-item"><span class="detail-label">Total Bundles</span><span class="detail-value">${fmtNum(plan.TotalBundles)}</span></div>
      <div class="detail-item"><span class="detail-label">Planned Start</span><span class="detail-value">${fmtDate(plan.PlannedStartDate)}</span></div>
      <div class="detail-item"><span class="detail-label">Planned End</span><span class="detail-value">${fmtDate(plan.PlannedEndDate)}</span></div>
      <div class="detail-item"><span class="detail-label">Created By</span><span class="detail-value">${escHtml(plan.CreatedBy)}</span></div>
    </div>

    ${plan.Notes ? `<div class="info-box mt-2"><strong>Notes:</strong> ${escHtml(plan.Notes)}</div>` : ''}

    <div class="section-divider">Bundles ${(plan.Bundles||[]).length > 0 ? `(${plan.Bundles.length} total)` : ''}</div>

    ${(plan.Bundles||[]).length === 0
      ? `<div class="empty-state-sm">No bundles yet. Generate bundles to begin production.</div>`
      : `
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr>
              <th>#</th><th>Barcode</th><th>Size</th><th>Color</th><th>Pcs</th>
              <th>Cutting</th><th>Stitching</th><th>Finishing</th><th>Packing</th><th></th>
            </tr></thead>
            <tbody>${bundleRows}</tbody>
          </table>
        </div>
        ${moreCount > 0 ? `<p class="text-muted text-sm mt-1">...and ${moreCount} more. Go to Bundle Tracking to view all.</p>` : ''}
      `
    }
  `;
  const footer = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${genBtn}${printBtn}${resetBtn}
      <div style="flex:1"></div>
      ${transitionBtns}
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>
  `;
  openModal(`Production Plan — ${plan.SONumber} / ${plan.ArticleName}`, body, footer, 'xl');
}

function changePlanStatus(planID, newStatus) {
  showConfirm(`Change status to "${newStatus}"?`, () => {
    google.script.run
      .withSuccessHandler(res => {
        if (!res.success) { showToast(res.message, 'error'); return; }
        showToast(`Plan status → ${newStatus}`, 'success');
        closeModal();
        loadProductionPlans();
      })
      .withFailureHandler(err => showToast(err.message, 'error'))
      .serverUpdatePlanStatus(appState.token, planID, newStatus);
  });
}

function generatePlanBundles(planID) {
  showConfirm('Generate bundles for this plan? This will create individual bundle records with barcodes.', () => {
    google.script.run
      .withSuccessHandler(res => {
        if (!res.success) { showToast(res.message, 'error'); return; }
        showToast(`${res.data.bundleCount} bundles generated`, 'success');
        closeModal();
        viewProductionPlan(planID);
      })
      .withFailureHandler(err => showToast(err.message, 'error'))
      .serverGenerateBundles(appState.token, planID);
  });
}

function resetPlanBundles(planID) {
  showConfirm('Delete all bundles for this plan and reset to Draft? This cannot be undone.', () => {
    google.script.run
      .withSuccessHandler(res => {
        if (!res.success) { showToast(res.message, 'error'); return; }
        showToast('Bundles deleted, plan reset to Draft', 'success');
        closeModal();
        viewProductionPlan(planID);
      })
      .withFailureHandler(err => showToast(err.message, 'error'))
      .serverDeletePlanBundles(appState.token, planID);
  });
}

function printBundleLabels(planID) {
  google.script.run
    .withSuccessHandler(res => {
      if (!res.success) { showToast(res.message, 'error'); return; }
      openLabelPrintWindow(res.data);
    })
    .withFailureHandler(err => showToast(err.message, 'error'))
    .serverGetBundleLabelData(appState.token, planID);
}

function openLabelPrintWindow(data) {
  const labels = data.labels || [];
  const rows = labels.map(l => `
    <div class="bundle-label">
      <div class="label-header">
        <strong>${escHtml(l.BuyerName)}</strong> — ${escHtml(l.SONumber)}
      </div>
      <div class="label-article">${escHtml(l.ArticleName)} | ${escHtml(l.StyleCode)}</div>
      <div class="label-barcode">${escHtml(l.BarcodeValue)}</div>
      <div class="label-details">
        <span>Size: <strong>${escHtml(l.Size)}</strong></span>
        <span>Color: <strong>${escHtml(l.Color || '—')}</strong></span>
        <span>Pcs: <strong>${l.Pieces}</strong></span>
        <span>Bundle #${l.BundleNumber}</span>
      </div>
    </div>
  `).join('');

  const html = `<!DOCTYPE html><html><head><title>Bundle Labels</title>
    <style>
      body { font-family: monospace; background: #fff; margin: 0; }
      .bundle-label { border: 2px solid #000; padding: 8px 12px; margin: 8px; width: 260px;
        display: inline-block; vertical-align: top; page-break-inside: avoid; }
      .label-header { font-size: 13px; margin-bottom: 2px; }
      .label-article { font-size: 11px; color: #444; margin-bottom: 4px; }
      .label-barcode { font-size: 22px; font-weight: bold; letter-spacing: 3px;
        border: 1px solid #ccc; padding: 4px; text-align: center; margin: 4px 0;
        background: #f5f5f5; }
      .label-details { font-size: 11px; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
      @media print { body { margin: 0; } }
    </style>
    <script>window.onload = () => window.print();<\/script>
  </head><body>${rows}</body></html>`;

  const w = window.open('', '_blank', 'width=900,height=700');
  if (w) { w.document.write(html); w.document.close(); }
  else showToast('Pop-up blocked. Please allow pop-ups.', 'error');
}
</script>

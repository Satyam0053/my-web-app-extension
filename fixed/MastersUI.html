<script>
// ============================================================
// MastersUI.html — Client-side JS for Sprint S1 Masters
// Articles, Fabrics (+ Colors), Vendors, Users, Settings, Audit
// Include this file via <?!= include('MastersUI'); ?> in index.html
// ============================================================

// ══════════════════════════════════════════════════════════════
// ARTICLES
// ══════════════════════════════════════════════════════════════

function renderArticles() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { setPageContent(errorHTML(res.message)); return; }
      const articles = res.data.articles || [];

      // Enrich with buyer names
      const buyers = (ERP.dropdowns && ERP.dropdowns.buyers) || [];
      const buyerMap = {};
      buyers.forEach(function(b) { buyerMap[b.id] = b.name; });

      const enriched = articles.map(function(a) {
        return Object.assign({}, a, { BuyerName: buyerMap[a.BuyerID] || a.BuyerID });
      });

      const html = renderDataTable({
        data: enriched,
        title: 'Article / Style Master',
        subtitle: 'Manage styles and articles by buyer',
        addLabel: 'Add Article',
        onAdd: 'openAddArticle',
        idKey: 'ArticleID',
        onEdit: 'openEditArticle',
        columns: [
          { key: 'ArticleID',   label: 'Article ID' },
          { key: 'ArticleCode', label: 'Code' },
          { key: 'ArticleName', label: 'Article Name' },
          { key: 'BuyerName',   label: 'Buyer' },
          { key: 'Category',    label: 'Category' },
          { key: 'Season',      label: 'Season' },
          { key: 'Status',      label: 'Status', render: function(v) { return statusBadge(v); } }
        ]
      });
      setPageContent(html);
    })
    .withFailureHandler(function() { setPageContent(errorHTML('Failed to load articles')); })
    .serverGetArticles(ERP.token, {});
}

function openAddArticle() {
  loadDropdowns(function() {
    openModal('Add New Article', getArticleFormHTML(null), `
      <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveArticle()">Save Article</button>
    `);
  });
}

function openEditArticle(id) {
  loadDropdowns(function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { showToast('error', 'Error', res.message); return; }
        const article = (res.data.articles || []).find(function(a) { return a.ArticleID === id; });
        if (!article) { showToast('error', 'Error', 'Article not found'); return; }
        openModal('Edit Article', getArticleFormHTML(article), `
          <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveArticle('${id}')">Update Article</button>
        `);
      })
      .withFailureHandler(function() { showToast('error', 'Error', 'Failed to load'); })
      .serverGetArticles(ERP.token, {});
  });
}

function getArticleFormHTML(article) {
  const a = article || {};
  const buyers = (ERP.dropdowns && ERP.dropdowns.buyers) || [];
  const categories = (ERP.dropdowns && ERP.dropdowns.articleCategories) || [];

  const buyerOptions = buyers.map(function(b) {
    return `<option value="${escHtml(b.id)}" ${a.BuyerID === b.id ? 'selected' : ''}>${escHtml(b.name)}</option>`;
  }).join('');

  const catOptions = categories.map(function(c) {
    return `<option value="${escHtml(c)}" ${a.Category === c ? 'selected' : ''}>${escHtml(c)}</option>`;
  }).join('');

  return `
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label required">Article Code</label>
        <input class="form-input" id="artCode" value="${escHtml(a.ArticleCode||'')}" placeholder="e.g. ART-001">
      </div>
      <div class="form-group">
        <label class="form-label required">Article Name</label>
        <input class="form-input" id="artName" value="${escHtml(a.ArticleName||'')}" placeholder="e.g. Formal Cotton Shirt">
      </div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label required">Buyer</label>
        <select class="form-select" id="artBuyer">
          <option value="">-- Select Buyer --</option>
          ${buyerOptions}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-select" id="artCategory">
          <option value="">-- Select --</option>
          ${catOptions}
        </select>
      </div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label">Season</label>
        <input class="form-input" id="artSeason" value="${escHtml(a.Season||'')}" placeholder="e.g. AW2026">
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="artStatus">
          <option value="Active" ${a.Status==='Active'||!a.Status?'selected':''}>Active</option>
          <option value="Inactive" ${a.Status==='Inactive'?'selected':''}>Inactive</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-textarea" id="artDesc" placeholder="Optional description">${escHtml(a.Description||'')}</textarea>
    </div>
  `;
}

function saveArticle(id) {
  const data = {
    ArticleCode:  document.getElementById('artCode').value.trim(),
    ArticleName:  document.getElementById('artName').value.trim(),
    BuyerID:      document.getElementById('artBuyer').value,
    Category:     document.getElementById('artCategory').value,
    Season:       document.getElementById('artSeason').value.trim(),
    Description:  document.getElementById('artDesc').value.trim(),
    Status:       document.getElementById('artStatus').value
  };
  if (!data.ArticleCode) { showToast('warning', 'Validation', 'Article Code is required'); return; }
  if (!data.ArticleName) { showToast('warning', 'Validation', 'Article Name is required'); return; }
  if (!data.BuyerID)     { showToast('warning', 'Validation', 'Please select a Buyer'); return; }

  const fn = id ? 'serverUpdateArticle' : 'serverCreateArticle';
  const args = id ? [ERP.token, id, data] : [ERP.token, data];
  const btn = document.querySelector('#globalModal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showToast('error', 'Error', res.message);
        if (btn) { btn.disabled = false; btn.textContent = id ? 'Update Article' : 'Save Article'; }
        return;
      }
      showToast('success', 'Success', id ? 'Article updated' : 'Article created');
      _closeModal();
      loadDropdowns();
      renderArticles();
    })
    .withFailureHandler(function() {
      showToast('error', 'Error', 'Failed to save');
      if (btn) btn.disabled = false;
    })
    [fn].apply(google.script.run, args);
}

// ══════════════════════════════════════════════════════════════
// FABRIC MASTER + COLORS
// ══════════════════════════════════════════════════════════════

function renderFabrics() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { setPageContent(errorHTML(res.message)); return; }
      const fabrics = res.data.fabrics || [];
      const html = renderDataTable({
        data: fabrics,
        title: 'Fabric Master',
        subtitle: 'Manage fabric designs and their color variants',
        addLabel: 'Add Fabric',
        onAdd: 'openAddFabric',
        idKey: 'FabricID',
        onEdit: 'openEditFabric',
        extraActions: function(row) {
          return `<button class="action-btn view" onclick="openFabricColors('${row.FabricID}','${escHtml(row.DesignName)}')" title="Manage Colors" style="background:var(--teal-dim);color:var(--teal)">🎨</button>`;
        },
        columns: [
          { key: 'FabricID',   label: 'Fabric ID' },
          { key: 'DesignCode', label: 'Design Code' },
          { key: 'DesignName', label: 'Design Name' },
          { key: 'Category',   label: 'Category' },
          { key: 'Width',      label: 'Width (in)', render: function(v) { return v ? v + '"' : '--'; } },
          { key: 'UOM',        label: 'UOM' },
          { key: 'Status',     label: 'Status', render: function(v) { return statusBadge(v); } }
        ]
      });
      setPageContent(html);
    })
    .withFailureHandler(function() { setPageContent(errorHTML('Failed to load fabrics')); })
    .serverGetFabrics(ERP.token);
}

function openAddFabric() {
  loadDropdowns(function() {
    openModal('Add New Fabric', getFabricFormHTML(null), `
      <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveFabric()">Save Fabric</button>
    `);
  });
}

function openEditFabric(id) {
  loadDropdowns(function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { showToast('error', 'Error', res.message); return; }
        const fabric = (res.data.fabrics || []).find(function(f) { return f.FabricID === id; });
        if (!fabric) { showToast('error', 'Error', 'Fabric not found'); return; }
        openModal('Edit Fabric', getFabricFormHTML(fabric), `
          <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveFabric('${id}')">Update Fabric</button>
        `);
      })
      .withFailureHandler(function() { showToast('error', 'Error', 'Failed to load'); })
      .serverGetFabrics(ERP.token);
  });
}

function getFabricFormHTML(fabric) {
  const f = fabric || {};
  const categories = (ERP.dropdowns && ERP.dropdowns.fabricCategories) || [];
  const uoms = ['Meters', 'Yards'];

  const catOptions = categories.map(function(c) {
    return `<option value="${escHtml(c)}" ${f.Category === c ? 'selected' : ''}>${escHtml(c)}</option>`;
  }).join('');

  const uomOptions = uoms.map(function(u) {
    return `<option value="${u}" ${(f.UOM||'Meters') === u ? 'selected' : ''}>${u}</option>`;
  }).join('');

  return `
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label required">Design Code</label>
        <input class="form-input" id="fabCode" value="${escHtml(f.DesignCode||'')}" placeholder="e.g. FAB-CTN-001">
      </div>
      <div class="form-group">
        <label class="form-label required">Design Name</label>
        <input class="form-input" id="fabName" value="${escHtml(f.DesignName||'')}" placeholder="e.g. Premium Cotton Stripe">
      </div>
    </div>
    <div class="form-row cols-3">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-select" id="fabCategory">
          <option value="">-- Select --</option>
          ${catOptions}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Width (inches)</label>
        <input class="form-input" id="fabWidth" type="number" value="${f.Width||''}" placeholder="e.g. 44">
      </div>
      <div class="form-group">
        <label class="form-label">UOM</label>
        <select class="form-select" id="fabUOM">${uomOptions}</select>
      </div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label">Remarks</label>
        <input class="form-input" id="fabRemarks" value="${escHtml(f.Remarks||'')}" placeholder="Optional remarks">
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="fabStatus">
          <option value="Active" ${f.Status==='Active'||!f.Status?'selected':''}>Active</option>
          <option value="Inactive" ${f.Status==='Inactive'?'selected':''}>Inactive</option>
        </select>
      </div>
    </div>
  `;
}

function saveFabric(id) {
  const data = {
    DesignCode: document.getElementById('fabCode').value.trim(),
    DesignName: document.getElementById('fabName').value.trim(),
    Category:   document.getElementById('fabCategory').value,
    Width:      document.getElementById('fabWidth').value,
    UOM:        document.getElementById('fabUOM').value,
    Remarks:    document.getElementById('fabRemarks').value.trim(),
    Status:     document.getElementById('fabStatus').value
  };
  if (!data.DesignCode) { showToast('warning', 'Validation', 'Design Code is required'); return; }
  if (!data.DesignName) { showToast('warning', 'Validation', 'Design Name is required'); return; }

  const fn = id ? 'serverUpdateFabric' : 'serverCreateFabric';
  const args = id ? [ERP.token, id, data] : [ERP.token, data];
  const btn = document.querySelector('#globalModal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showToast('error', 'Error', res.message);
        if (btn) { btn.disabled = false; btn.textContent = id ? 'Update Fabric' : 'Save Fabric'; }
        return;
      }
      showToast('success', 'Success', id ? 'Fabric updated' : 'Fabric created');
      _closeModal();
      loadDropdowns();
      renderFabrics();
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to save'); if (btn) btn.disabled = false; })
    [fn].apply(google.script.run, args);
}

// ── Fabric Colors Manager ──────────────────────────────────
function openFabricColors(fabricID, fabricName) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error', 'Error', res.message); return; }
      const colors = res.data.colors || [];
      openModal('Colors — ' + fabricName, getFabricColorsHTML(fabricID, colors), `
        <button class="btn btn-ghost" onclick="_closeModal()">Close</button>
        <button class="btn btn-primary" onclick="openAddColorForm('${fabricID}')">+ Add Color</button>
      `, 'sm');
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to load colors'); })
    .serverGetFabricColors(ERP.token, fabricID);
}

function getFabricColorsHTML(fabricID, colors) {
  if (!colors.length) {
    return `<div style="text-align:center;padding:24px;color:var(--text-muted)">No colors added yet. Click "+ Add Color" to begin.</div>`;
  }
  const rows = colors.map(function(c) {
    const swatch = c.ColorCode ? `<span style="display:inline-block;width:14px;height:14px;background:${escHtml(c.ColorCode)};border-radius:3px;border:1px solid var(--border);vertical-align:middle;margin-right:6px"></span>` : '';
    return `<tr>
      <td>${escHtml(c.FabricColorID)}</td>
      <td>${swatch}${escHtml(c.ColorName)}</td>
      <td><span class="mono">${escHtml(c.ColorCode||'--')}</span></td>
      <td>${statusBadge(c.Status)}</td>
      <td><button class="action-btn edit" onclick="openEditColorForm('${c.FabricColorID}','${escHtml(c.ColorName)}','${escHtml(c.ColorCode||'')}','${c.Status}')" title="Edit">✏️</button></td>
    </tr>`;
  }).join('');
  return `
    <div id="colorFormArea"></div>
    <div class="table-wrapper">
      <table><thead><tr><th>ID</th><th>Color Name</th><th>Code</th><th>Status</th><th></th></tr></thead>
      <tbody id="colorRows">${rows}</tbody></table>
    </div>`;
}

function openAddColorForm(fabricID) {
  const area = document.getElementById('colorFormArea');
  if (area) {
    area.innerHTML = `
      <div class="card" style="margin-bottom:16px;background:var(--bg-elevated)">
        <div class="form-row cols-3">
          <div class="form-group"><label class="form-label required">Color Name</label><input class="form-input" id="newColorName" placeholder="e.g. Royal Blue"></div>
          <div class="form-group"><label class="form-label">Hex Code</label><input class="form-input" id="newColorCode" type="color" value="#000000" style="padding:4px;height:42px"></div>
          <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="newColorStatus"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="saveColor('${fabricID}')">Add Color</button>
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('colorFormArea').innerHTML=''">Cancel</button>
        </div>
      </div>`;
  }
}

function openEditColorForm(id, name, code, status) {
  const area = document.getElementById('colorFormArea');
  if (area) {
    area.innerHTML = `
      <div class="card" style="margin-bottom:16px;background:var(--bg-elevated)">
        <div class="form-row cols-3">
          <div class="form-group"><label class="form-label required">Color Name</label><input class="form-input" id="editColorName" value="${escHtml(name)}"></div>
          <div class="form-group"><label class="form-label">Hex Code</label><input class="form-input" id="editColorCode" type="color" value="${escHtml(code||'#000000')}" style="padding:4px;height:42px"></div>
          <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="editColorStatus"><option value="Active" ${status==='Active'?'selected':''}>Active</option><option value="Inactive" ${status==='Inactive'?'selected':''}>Inactive</option></select></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="updateColor('${id}')">Update</button>
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('colorFormArea').innerHTML=''">Cancel</button>
        </div>
      </div>`;
  }
}

function saveColor(fabricID) {
  const data = {
    FabricID:  fabricID,
    ColorName: document.getElementById('newColorName').value.trim(),
    ColorCode: document.getElementById('newColorCode').value,
    Status:    document.getElementById('newColorStatus').value
  };
  if (!data.ColorName) { showToast('warning', 'Validation', 'Color name required'); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error', 'Error', res.message); return; }
      showToast('success', 'Success', 'Color added');
      loadDropdowns();
      openFabricColors(fabricID, '');
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to add color'); })
    .serverAddFabricColor(ERP.token, data);
}

function updateColor(id) {
  const data = {
    ColorName: document.getElementById('editColorName').value.trim(),
    ColorCode: document.getElementById('editColorCode').value,
    Status:    document.getElementById('editColorStatus').value
  };
  if (!data.ColorName) { showToast('warning', 'Validation', 'Color name required'); return; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error', 'Error', res.message); return; }
      showToast('success', 'Success', 'Color updated');
      loadDropdowns();
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to update'); })
    .serverUpdateFabricColor(ERP.token, id, data);
}

// ══════════════════════════════════════════════════════════════
// VENDOR MASTER
// ══════════════════════════════════════════════════════════════

function renderVendors() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { setPageContent(errorHTML(res.message)); return; }
      const vendors = res.data.vendors || [];
      const html = renderDataTable({
        data: vendors,
        title: 'Vendor Master',
        subtitle: 'Manage fabric vendors and fabricators',
        addLabel: 'Add Vendor',
        onAdd: 'openAddVendor',
        idKey: 'VendorID',
        onEdit: 'openEditVendor',
        columns: [
          { key: 'VendorID',   label: 'Vendor ID' },
          { key: 'VendorName', label: 'Vendor Name' },
          { key: 'VendorCode', label: 'Code' },
          { key: 'VendorType', label: 'Type', render: function(v) {
              const m = { 'Fabric Vendor': 'badge-blue', Fabricator: 'badge-purple', Both: 'badge-teal' };
              return `<span class="badge ${m[v]||'badge-muted'}">${escHtml(v||'--')}</span>`;
            }
          },
          { key: 'ContactPerson', label: 'Contact' },
          { key: 'Mobile',     label: 'Mobile' },
          { key: 'GSTNumber',  label: 'GST' },
          { key: 'Status',     label: 'Status', render: function(v) { return statusBadge(v); } }
        ]
      });
      setPageContent(html);
    })
    .withFailureHandler(function() { setPageContent(errorHTML('Failed to load vendors')); })
    .serverGetVendors(ERP.token, null);
}

function openAddVendor() {
  loadDropdowns(function() {
    openModal('Add New Vendor', getVendorFormHTML(null), `
      <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveVendor()">Save Vendor</button>
    `);
  });
}

function openEditVendor(id) {
  loadDropdowns(function() {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { showToast('error', 'Error', res.message); return; }
        const vendor = (res.data.vendors || []).find(function(v) { return v.VendorID === id; });
        if (!vendor) { showToast('error', 'Error', 'Vendor not found'); return; }
        openModal('Edit Vendor', getVendorFormHTML(vendor), `
          <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveVendor('${id}')">Update Vendor</button>
        `);
      })
      .withFailureHandler(function() { showToast('error', 'Error', 'Failed to load'); })
      .serverGetVendors(ERP.token, null);
  });
}

function getVendorFormHTML(vendor) {
  const v = vendor || {};
  const types = (ERP.dropdowns && ERP.dropdowns.vendorTypes) || ['Fabric Vendor', 'Fabricator', 'Both'];
  const typeOptions = types.map(function(t) {
    return `<option value="${escHtml(t)}" ${v.VendorType === t ? 'selected' : ''}>${escHtml(t)}</option>`;
  }).join('');

  return `
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label required">Vendor Name</label>
        <input class="form-input" id="vndName" value="${escHtml(v.VendorName||'')}" placeholder="Vendor company name">
      </div>
      <div class="form-group">
        <label class="form-label">Vendor Code</label>
        <input class="form-input" id="vndCode" value="${escHtml(v.VendorCode||'')}" placeholder="e.g. VND001">
      </div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label required">Vendor Type</label>
        <select class="form-select" id="vndType">
          <option value="">-- Select Type --</option>
          ${typeOptions}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">GST Number</label>
        <input class="form-input" id="vndGST" value="${escHtml(v.GSTNumber||'')}" placeholder="15-char GST number" maxlength="15">
      </div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label">Contact Person</label>
        <input class="form-input" id="vndContact" value="${escHtml(v.ContactPerson||'')}" placeholder="Contact name">
      </div>
      <div class="form-group">
        <label class="form-label">Mobile</label>
        <input class="form-input" id="vndMobile" value="${escHtml(v.Mobile||'')}" placeholder="10-digit number" maxlength="10">
      </div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" id="vndEmail" type="email" value="${escHtml(v.Email||'')}" placeholder="vendor@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="vndStatus">
          <option value="Active" ${v.Status==='Active'||!v.Status?'selected':''}>Active</option>
          <option value="Inactive" ${v.Status==='Inactive'?'selected':''}>Inactive</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Address</label>
      <textarea class="form-textarea" id="vndAddress" placeholder="Full address">${escHtml(v.Address||'')}</textarea>
    </div>
  `;
}

function saveVendor(id) {
  const data = {
    VendorName:    document.getElementById('vndName').value.trim(),
    VendorCode:    document.getElementById('vndCode').value.trim(),
    VendorType:    document.getElementById('vndType').value,
    GSTNumber:     document.getElementById('vndGST').value.trim().toUpperCase(),
    ContactPerson: document.getElementById('vndContact').value.trim(),
    Mobile:        document.getElementById('vndMobile').value.trim(),
    Email:         document.getElementById('vndEmail').value.trim(),
    Address:       document.getElementById('vndAddress').value.trim(),
    Status:        document.getElementById('vndStatus').value
  };
  if (!data.VendorName) { showToast('warning', 'Validation', 'Vendor Name is required'); return; }
  if (!data.VendorType) { showToast('warning', 'Validation', 'Please select Vendor Type'); return; }

  const fn = id ? 'serverUpdateVendor' : 'serverCreateVendor';
  const args = id ? [ERP.token, id, data] : [ERP.token, data];
  const btn = document.querySelector('#globalModal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showToast('error', 'Error', res.message);
        if (btn) { btn.disabled = false; btn.textContent = id ? 'Update Vendor' : 'Save Vendor'; }
        return;
      }
      showToast('success', 'Success', id ? 'Vendor updated' : 'Vendor created');
      _closeModal();
      loadDropdowns();
      renderVendors();
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to save'); if (btn) btn.disabled = false; })
    [fn].apply(google.script.run, args);
}

// ══════════════════════════════════════════════════════════════
// USER MANAGEMENT
// ══════════════════════════════════════════════════════════════

function renderUsers() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { setPageContent(errorHTML(res.message)); return; }
      const users = res.data.users || [];
      const html = renderDataTable({
        data: users,
        title: 'User Management',
        subtitle: 'Manage ERP system users and access',
        addLabel: 'Add User',
        onAdd: 'openAddUser',
        idKey: 'UserID',
        onEdit: 'openEditUser',
        extraActions: function(row) {
          return `<button class="action-btn" onclick="openResetPassword('${row.UserID}')" title="Reset Password" style="background:var(--orange-dim);color:var(--orange)">🔑</button>`;
        },
        columns: [
          { key: 'UserID',   label: 'User ID' },
          { key: 'FullName', label: 'Full Name' },
          { key: 'Email',    label: 'Email' },
          { key: 'Role',     label: 'Role', render: function(v) {
              const m = { 'Super Admin':'badge-accent','Admin':'badge-info','Purchase':'badge-warning','Store':'badge-purple','Production':'badge-success','Dispatch':'badge-teal','Viewer':'badge-muted' };
              return `<span class="badge ${m[v]||'badge-muted'}">${escHtml(v)}</span>`;
            }
          },
          { key: 'Status',      label: 'Status', render: function(v) { return statusBadge(v); } },
          { key: 'LastLogin',   label: 'Last Login', render: function(v) { return fmtDateTime(v) || 'Never'; } },
          { key: 'FailedAttempts', label: 'Failed Attempts' }
        ]
      });
      setPageContent(html);
    })
    .withFailureHandler(function() { setPageContent(errorHTML('Failed to load users')); })
    .serverGetUsers(ERP.token);
}

function openAddUser() {
  loadDropdowns(function() {
    openModal('Add New User', getUserFormHTML(null), `
      <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser()">Create User</button>
    `);
  });
}

function openEditUser(id) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error', 'Error', res.message); return; }
      const user = (res.data.users || []).find(function(u) { return u.UserID === id; });
      if (!user) { showToast('error', 'Error', 'User not found'); return; }
      openModal('Edit User', getUserFormHTML(user, true), `
        <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveUser('${id}')">Update User</button>
      `);
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to load'); })
    .serverGetUsers(ERP.token);
}

function getUserFormHTML(user, editing) {
  const u = user || {};
  const roles = ['Super Admin', 'Admin', 'Purchase', 'Store', 'Production', 'Dispatch', 'Viewer'];
  const statuses = ['Active', 'Inactive', 'Locked'];
  const currentRole = ERP.user && ERP.user.role;
  const isSuperAdmin = currentRole === 'Super Admin';

  const roleOptions = roles.map(function(r) {
    const disabled = (r === 'Super Admin' && !isSuperAdmin) ? 'disabled' : '';
    return `<option value="${r}" ${u.Role === r ? 'selected' : ''} ${disabled}>${r}</option>`;
  }).join('');

  const statusOptions = statuses.map(function(s) {
    return `<option value="${s}" ${(u.Status||'Active') === s ? 'selected' : ''}>${s}</option>`;
  }).join('');

  return `
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label required">Full Name</label>
        <input class="form-input" id="usrName" value="${escHtml(u.FullName||'')}" placeholder="Full name">
      </div>
      <div class="form-group">
        <label class="form-label required">Email</label>
        <input class="form-input" id="usrEmail" type="email" value="${escHtml(u.Email||'')}" placeholder="user@example.com" ${editing ? 'readonly style="opacity:0.6"' : ''}>
      </div>
    </div>
    ${!editing ? `
    <div class="form-group">
      <label class="form-label required">Password</label>
      <input class="form-input" id="usrPassword" type="password" placeholder="Min. 8 characters">
      <p class="form-hint">Must be at least 8 characters</p>
    </div>` : ''}
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label required">Role</label>
        <select class="form-select" id="usrRole">${roleOptions}</select>
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="usrStatus">${statusOptions}</select>
      </div>
    </div>
    ${editing ? `<p class="form-hint">Use "Reset Password" button to change a user's password.</p>` : ''}
  `;
}

function saveUser(id) {
  const data = {
    FullName: document.getElementById('usrName').value.trim(),
    Role:     document.getElementById('usrRole').value,
    Status:   document.getElementById('usrStatus').value
  };
  if (!id) {
    data.Email    = document.getElementById('usrEmail').value.trim();
    data.Password = document.getElementById('usrPassword').value;
  }
  if (!data.FullName) { showToast('warning', 'Validation', 'Full Name is required'); return; }
  if (!id && !data.Email) { showToast('warning', 'Validation', 'Email is required'); return; }
  if (!id && !data.Password) { showToast('warning', 'Validation', 'Password is required'); return; }
  if (!data.Role) { showToast('warning', 'Validation', 'Please select a role'); return; }

  const fn = id ? 'serverUpdateUser' : 'serverCreateUser';
  const args = id ? [ERP.token, id, data] : [ERP.token, data];
  const btn = document.querySelector('#globalModal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showToast('error', 'Error', res.message);
        if (btn) { btn.disabled = false; btn.textContent = id ? 'Update User' : 'Create User'; }
        return;
      }
      showToast('success', 'Success', id ? 'User updated' : 'User created');
      _closeModal();
      renderUsers();
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to save'); if (btn) btn.disabled = false; })
    [fn].apply(google.script.run, args);
}

function openResetPassword(id) {
  openModal('Reset Password', `
    <p style="color:var(--text-secondary);margin-bottom:16px">Set a new password for this user. They will be unlocked if their account was locked.</p>
    <div class="form-group">
      <label class="form-label required">New Password</label>
      <input class="form-input" id="resetNewPass" type="password" placeholder="Min. 8 characters">
    </div>
    <div class="form-group">
      <label class="form-label required">Confirm Password</label>
      <input class="form-input" id="resetConfirmPass" type="password" placeholder="Re-enter password">
    </div>
  `, `
    <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
    <button class="btn btn-danger" onclick="doResetPassword('${id}')">Reset Password</button>
  `, 'sm');
}

function doResetPassword(id) {
  const newPass = document.getElementById('resetNewPass').value;
  const confirm = document.getElementById('resetConfirmPass').value;
  if (!newPass) { showToast('warning', 'Validation', 'Password required'); return; }
  if (newPass.length < 8) { showToast('warning', 'Validation', 'Min. 8 characters'); return; }
  if (newPass !== confirm) { showToast('warning', 'Validation', 'Passwords do not match'); return; }

  const btn = document.querySelector('#globalModal .btn-danger');
  if (btn) { btn.disabled = true; btn.textContent = 'Resetting...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error', 'Error', res.message); if(btn){btn.disabled=false;btn.textContent='Reset Password';} return; }
      showToast('success', 'Success', 'Password reset successfully');
      _closeModal();
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to reset'); if(btn) btn.disabled = false; })
    .serverResetPassword(ERP.token, id, newPass);
}

function renderAuditLogs() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { setPageContent(errorHTML(res.message)); return; }
      const logs = res.data.logs || [];
      const html = renderDataTable({
        data: logs,
        title: 'Audit Logs',
        subtitle: 'Complete trail of all system activity',
        idKey: 'LogID',
        columns: [
          { key: 'Timestamp', label: 'When', render: function(v) { return fmtDateTime(v); } },
          { key: 'UserName',  label: 'User' },
          { key: 'Action',    label: 'Action', render: function(v) {
              const m = { CREATE:'badge-success', UPDATE:'badge-info', DELETE:'badge-danger', LOGIN:'badge-accent', LOGOUT:'badge-muted', APPROVE:'badge-warning' };
              return `<span class="badge ${m[v]||'badge-muted'}">${escHtml(v)}</span>`;

// SETTINGS
// ══════════════════════════════════════════════════════════════

function renderSettings() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { setPageContent(errorHTML(res.message)); return; }
      const settings = res.data.settings || [];

      const rows = settings.map(function(s) {
        return `<tr>
          <td><span class="mono">${escHtml(s.SettingKey)}</span></td>
          <td><input class="form-input" id="setting_${escHtml(s.SettingKey)}" value="${escHtml(s.SettingValue||'')}" style="max-width:280px"></td>
          <td style="color:var(--text-muted)">${escHtml(s.Description||'')}</td>
          <td><button class="btn btn-sm btn-secondary" onclick="saveSetting('${escHtml(s.SettingKey)}')">Save</button></td>
        </tr>`;
      }).join('');

      setPageContent(`
        <div class="page-header">
          <div>
            <h1 class="page-title">System Settings</h1>
            <p class="page-subtitle">Configure ERP-wide parameters</p>
          </div>
        </div>
        <div class="table-container">
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Setting Key</th><th>Value</th><th>Description</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `);
    })
    .withFailureHandler(function() { setPageContent(errorHTML('Failed to load settings')); })
    .serverGetSettings(ERP.token);
}

function saveSetting(key) {
  const input = document.getElementById('setting_' + key);
  if (!input) return;
  const value = input.value;
  google.script.run
    .withSuccessHandler(function(res) {
      if (res.success) showToast('success', 'Saved', key + ' updated');
      else showToast('error', 'Error', res.message);
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to save setting'); })
    .serverUpdateSetting(ERP.token, key, value);
}
</script>

<script>
// ============================================================
// PurchaseUI.html — Purchase Orders + GRN (Sprint S4)
// PO: list, create, view detail, approve, cancel
// GRN: list, create against approved PO with partial receiving
// ============================================================

// ══════════════════════════════════════════════════════════════
// PURCHASE ORDERS
// ══════════════════════════════════════════════════════════════

function renderPurchaseOrders() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { setPageContent(errorHTML(res.message)); return; }
      const orders = res.data.orders || [];

      const vendors   = (ERP.dropdowns && ERP.dropdowns.vendors) || [];
      const vendorMap = {};
      vendors.forEach(function(v) { vendorMap[v.id] = v.name; });

      const enriched = orders.map(function(o) {
        return Object.assign({}, o, { VendorName: vendorMap[o.VendorID] || o.VendorID });
      });

      const html = renderDataTable({
        data:     enriched,
        title:    'Purchase Orders',
        subtitle: 'Fabric purchase orders from vendors',
        addLabel: 'New Purchase Order',
        onAdd:    'openCreatePO',
        idKey:    'POID',
        onView:   'viewPO',
        columns: [
          { key: 'POID',        label: 'PO Number' },
          { key: 'PODate',      label: 'PO Date',    render: function(v) { return fmtDate(v); } },
          { key: 'VendorName',  label: 'Vendor' },
          { key: 'TotalAmount', label: 'Value',      render: function(v) { return v ? fmtCurrency(v) : '--'; } },
          { key: 'ApprovedBy',  label: 'Approved By', render: function(v) { return v || '--'; } },
          { key: 'Status',      label: 'Status',     render: function(v) { return statusBadge(v); } }
        ]
      });
      setPageContent(html);
    })
    .withFailureHandler(function() { setPageContent(errorHTML('Failed to load purchase orders')); })
    .serverGetPurchaseOrders(ERP.token, {});
}

function viewPO(poID) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error', 'Error', res.message); return; }
      const po    = res.data.po;
      const items = res.data.items || [];

      const vendors  = (ERP.dropdowns && ERP.dropdowns.vendors)       || [];
      const fabrics  = (ERP.dropdowns && ERP.dropdowns.fabrics)       || [];
      const colors   = (ERP.dropdowns && ERP.dropdowns.fabricColors)  || [];
      const vendorMap = {}; vendors.forEach(function(v) { vendorMap[v.id] = v.name; });
      const fabricMap = {}; fabrics.forEach(function(f) { fabricMap[f.id] = f.code + ' — ' + f.name; });
      const colorMap  = {}; colors.forEach(function(c) { colorMap[c.id]  = c.name; });

      const itemRows = items.map(function(item) {
        const recv    = parseFloat(item.ReceivedQty) || 0;
        const ordered = parseFloat(item.OrderedQty)  || 0;
        const pending = parseFloat(item.PendingQty)  || 0;
        const pct     = ordered > 0 ? Math.round((recv / ordered) * 100) : 0;

        return `
          <tr>
            <td>${escHtml(fabricMap[item.FabricID]||item.FabricID)}</td>
            <td>${escHtml(colorMap[item.FabricColorID]||item.FabricColorID)}</td>
            <td style="text-align:right">${fmtNum(ordered)}</td>
            <td style="text-align:right">${escHtml(item.UOM)}</td>
            <td style="text-align:right">${fmtCurrency(item.Rate||0)}</td>
            <td style="text-align:right">${fmtCurrency(item.Amount||0)}</td>
            <td style="text-align:right;color:var(--green)">${fmtNum(recv)}</td>
            <td style="text-align:right;color:${pending>0?'var(--amber)':'var(--green)'}">${fmtNum(pending)}</td>
            <td>
              <div class="progress-bar" style="min-width:80px">
                <div class="progress-fill ${pct===100?'green':'orange'}" style="width:${pct}%"></div>
              </div>
              <span style="font-size:11px;color:var(--text-muted)">${pct}%</span>
            </td>
          </tr>
        `;
      }).join('');

      const canApprove   = po.Status === 'Draft';
      const canGRN       = po.Status === 'Approved' || po.Status === 'Partially Received';
      const canCancel    = po.Status === 'Draft' || po.Status === 'Approved';

      openModal('Purchase Order — ' + po.POID, `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
          <div><label class="form-label">Vendor</label><div class="form-input" style="background:var(--surface2)">${escHtml(vendorMap[po.VendorID]||po.VendorID)}</div></div>
          <div><label class="form-label">Status</label><div>${statusBadge(po.Status)}</div></div>
          <div><label class="form-label">PO Date</label><div class="form-input" style="background:var(--surface2)">${fmtDate(po.PODate)}</div></div>
          <div><label class="form-label">Total Value</label><div class="form-input" style="background:var(--surface2);font-weight:700">${fmtCurrency(po.TotalAmount||0)}</div></div>
          ${po.ApprovedBy ? `<div><label class="form-label">Approved By</label><div class="form-input" style="background:var(--surface2)">${escHtml(po.ApprovedBy)}</div></div>
          <div><label class="form-label">Approved At</label><div class="form-input" style="background:var(--surface2)">${fmtDate(po.ApprovedAt)}</div></div>` : ''}
        </div>
        ${po.Remarks ? `<div style="margin-bottom:16px"><label class="form-label">Remarks</label><div class="form-input" style="background:var(--surface2)">${escHtml(po.Remarks)}</div></div>` : ''}

        <div style="font-weight:600;margin-bottom:8px">PO Items</div>
        <div style="overflow-x:auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Fabric Design</th><th>Color</th>
                <th style="text-align:right">Ordered</th><th>UOM</th>
                <th style="text-align:right">Rate</th><th style="text-align:right">Amount</th>
                <th style="text-align:right">Received</th><th style="text-align:right">Pending</th><th>Progress</th>
              </tr>
            </thead>
            <tbody>${itemRows || '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:20px">No items</td></tr>'}</tbody>
          </table>
        </div>
      `, `
        <button class="btn btn-ghost" onclick="_closeModal()">Close</button>
        ${canCancel  ? `<button class="btn btn-danger"    onclick="cancelPO('${escHtml(po.POID)}')">Cancel PO</button>`                       : ''}
        ${canGRN     ? `<button class="btn btn-secondary" onclick="_closeModal();openCreateGRN('${escHtml(po.POID)}')">Create GRN</button>`   : ''}
        ${canApprove ? `<button class="btn btn-primary"   onclick="approvePO('${escHtml(po.POID)}')">✓ Approve PO</button>`                  : ''}
      `, 'large');
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to load PO'); })
    .serverGetPOByID(ERP.token, poID);
}

function approvePO(poID) {
  showConfirm('Approve Purchase Order', 'Approve PO ' + poID + '? Once approved, fabric can be received against it.', function() {
    _closeModal();
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { showToast('error', 'Error', res.message); return; }
        showToast('success', 'Approved', 'Purchase Order approved');
        renderPurchaseOrders();
      })
      .withFailureHandler(function() { showToast('error', 'Error', 'Failed to approve PO'); })
      .serverApprovePO(ERP.token, poID);
  });
}

function cancelPO(poID) {
  showConfirm('Cancel Purchase Order', 'Cancel PO ' + poID + '? This cannot be undone.', function() {
    _closeModal();
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { showToast('error', 'Error', res.message); return; }
        showToast('success', 'Cancelled', 'Purchase Order cancelled');
        renderPurchaseOrders();
      })
      .withFailureHandler(function() { showToast('error', 'Error', 'Failed to cancel'); })
      .serverCancelPO(ERP.token, poID, '');
  });
}

// ── Create Purchase Order ──────────────────────────────────

var PO_ITEM_STATE = { rows: [], counter: 0 };

function openCreatePO() {

function _openCreatePOModal() {
  PO_ITEM_STATE = { rows: [], counter: 0 };
  const vendors  = (ERP.dropdowns && ERP.dropdowns.vendors) || [];
  const fabVendors = vendors.filter(function(v) { return v.type === 'Fabric Vendor' || v.type === 'Both'; });
  const today    = new Date().toISOString().slice(0, 10);

  const vendorOpts = fabVendors.map(function(v) {
    return `<option value="${escHtml(v.id)}">${escHtml(v.name)}</option>`;
  }).join('');

  openModal('New Purchase Order', `
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label required">Vendor (Fabric Supplier)</label>
        <select class="form-select" id="poVendor">
          <option value="">-- Select Vendor --</option>
          ${vendorOpts}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label required">PO Date</label>
        <input class="form-input" id="poDate" type="date" value="${today}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Remarks</label>
      <textarea class="form-textarea" id="poRemarks" placeholder="Optional remarks"></textarea>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px">
      <div style="font-weight:600">Fabric Items</div>
      <button class="btn btn-ghost" style="font-size:12px" onclick="addPOItemRow()">+ Add Fabric</button>
    </div>
    <div style="overflow-x:auto">
      <table class="data-table">
        <thead>
          <tr>
            <th style="min-width:160px">Fabric Design *</th>
            <th style="min-width:130px">Color *</th>
            <th style="min-width:90px">Qty *</th>
            <th style="min-width:80px">UOM *</th>
            <th style="min-width:70px">Width (in)</th>
            <th style="min-width:80px">Rate *</th>
            <th style="min-width:80px">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="poItemBody">
          <tr id="poEmptyRow"><td colspan="8" style="text-align:center;padding:20px;color:var(--text-muted)">No items. Click "+ Add Fabric".</td></tr>
        </tbody>
      </table>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <span style="font-size:13px;color:var(--text-muted)" id="poTotalLabel">Total: ₹0</span>
    </div>
  `, `
    <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="savePO()">Create Purchase Order</button>
  `, 'large');
}

function renderPOItemRow(row) {
  const rid     = row.id;
  const fabrics = (ERP.dropdowns && ERP.dropdowns.fabrics)      || [];
  const colors  = (ERP.dropdowns && ERP.dropdowns.fabricColors) || [];

  const fabOpts = fabrics.map(function(f) {
    return `<option value="${escHtml(f.id)}">${escHtml(f.code)} — ${escHtml(f.name)}</option>`;
  }).join('');

  return `
    <tr id="poItemRow_${rid}" data-rowid="${rid}">
      <td>
        <select class="form-select" id="poFabric_${rid}" style="min-width:150px" onchange="onPOFabricChange('${rid}')">
          <option value="">-- Select --</option>${fabOpts}
        </select>
      </td>
      <td>
        <select class="form-select" id="poColor_${rid}" style="min-width:120px">
          <option value="">-- Select --</option>
        </select>
      </td>
      <td><input class="form-input" id="poQty_${rid}" type="number" min="0.001" step="0.001" placeholder="100"
          style="min-width:80px" oninput="updatePOAmt('${rid}');updatePOTotal()"></td>
      <td>
        <select class="form-select" id="poUOM_${rid}" style="min-width:70px">
          <option value="Meters">Meters</option>
          <option value="Yards">Yards</option>
        </select>
      </td>
      <td><input class="form-input" id="poWidth_${rid}" type="number" min="0" step="0.5" placeholder="44"
          style="min-width:60px"></td>
      <td><input class="form-input" id="poRate_${rid}" type="number" min="0" step="0.01" placeholder="0.00"
          style="min-width:70px" oninput="updatePOAmt('${rid}');updatePOTotal()"></td>
      <td><span id="poAmt_${rid}" style="font-family:var(--font-mono);font-size:12px">--</span></td>
      <td><button class="action-btn delete" onclick="removePOItemRow('${rid}')" title="Remove">✕</button></td>
    </tr>
  `;
}
}
function addPOItemRow() {
  const emptyRow = document.getElementById('poEmptyRow');
  if (emptyRow) emptyRow.remove();
  const rid = '_' + (++PO_ITEM_STATE.counter);
  const row = { id: rid };
  PO_ITEM_STATE.rows.push(row);
  const tbody = document.getElementById('poItemBody');
  const tr    = document.createElement('tr');
  tr.id = 'poItemRow_' + rid;
  tr.dataset.rowid = rid;
  tr.innerHTML = renderPOItemRow(row).replace(/^<tr[^>]*>/, '').replace(/<\/tr>$/, '');
  tbody.appendChild(tr);
}

function removePOItemRow(rid) {
  PO_ITEM_STATE.rows = PO_ITEM_STATE.rows.filter(function(r) { return r.id !== rid; });
  const tr = document.getElementById('poItemRow_' + rid);
  if (tr) tr.remove();
  updatePOTotal();
  if (!document.querySelector('#poItemBody tr[data-rowid]')) {
    const tr2 = document.createElement('tr');
    tr2.id = 'poEmptyRow';
    tr2.innerHTML = '<td colspan="8" style="text-align:center;padding:20px;color:var(--text-muted)">No items. Click "+ Add Fabric".</td>';
    document.getElementById('poItemBody').appendChild(tr2);
  }
}

function onPOFabricChange(rid) {
  const fabricID = document.getElementById('poFabric_' + rid).value;
  const colors   = (ERP.dropdowns && ERP.dropdowns.fabricColors) || [];
  const sel      = document.getElementById('poColor_' + rid);
  const opts     = colors.filter(function(c) { return c.fabricID === fabricID; })
    .map(function(c) { return `<option value="${escHtml(c.id)}">${escHtml(c.name)}</option>`; }).join('');
  sel.innerHTML  = '<option value="">-- Select Color --</option>' + opts;
}

function updatePOAmt(rid) {
  const qty  = parseFloat(document.getElementById('poQty_'  + rid).value) || 0;
  const rate = parseFloat(document.getElementById('poRate_' + rid).value) || 0;
  const amt  = qty * rate;
  document.getElementById('poAmt_' + rid).textContent = amt > 0 ? fmtCurrency(amt) : '--';
}

function updatePOTotal() {
  let total = 0;
  document.querySelectorAll('#poItemBody tr[data-rowid]').forEach(function(tr) {
    const rid  = tr.dataset.rowid;
    const qty  = parseFloat(document.getElementById('poQty_'  + rid).value) || 0;
    const rate = parseFloat(document.getElementById('poRate_' + rid).value) || 0;
    total += qty * rate;
  });
  const lbl = document.getElementById('poTotalLabel');
  if (lbl) lbl.textContent = 'Total: ' + fmtCurrency(total);
}

function savePO() {
  const vendorID = document.getElementById('poVendor').value;
  const poDate   = document.getElementById('poDate').value;
  const remarks  = document.getElementById('poRemarks').value.trim();

  if (!vendorID) { showToast('warning', 'Validation', 'Please select a Vendor'); return; }
  if (!poDate)   { showToast('warning', 'Validation', 'PO Date is required'); return; }

  const rows   = document.querySelectorAll('#poItemBody tr[data-rowid]');
  const items  = [];
  let hasError = false;

  rows.forEach(function(tr) {
    if (hasError) return;
    const rid         = tr.dataset.rowid;
    const fabricID    = document.getElementById('poFabric_'+ rid).value;
    const colorID     = document.getElementById('poColor_' + rid).value;
    const qty         = document.getElementById('poQty_'   + rid).value;
    const uom         = document.getElementById('poUOM_'   + rid).value;
    const width       = document.getElementById('poWidth_' + rid).value;
    const rate        = document.getElementById('poRate_'  + rid).value;

    if (!fabricID || !colorID || !qty || !rate) {
      showToast('warning', 'Validation', 'Fabric Design, Color, Qty, and Rate are required for each item');
      hasError = true;
      return;
    }
    items.push({ FabricID: fabricID, FabricColorID: colorID, OrderedQty: parseFloat(qty), UOM: uom, Width: parseFloat(width)||0, Rate: parseFloat(rate) });
  });

  if (hasError) return;
  if (items.length === 0) { showToast('warning', 'Validation', 'At least one fabric item is required'); return; }

  const btn = document.querySelector('#globalModal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showToast('error', 'Error', res.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Create Purchase Order'; }
        return;
      }
      showToast('success', 'Success', 'Purchase Order created: ' + res.data.POID);
      _closeModal();
      renderPurchaseOrders();
    })
    .withFailureHandler(function() {
      showToast('error', 'Error', 'Failed to create PO');
      if (btn) btn.disabled = false;
    })
    .serverCreatePO(ERP.token, { VendorID: vendorID, PODate: poDate, Remarks: remarks, items: items });
}

// ══════════════════════════════════════════════════════════════
// GRN
// ══════════════════════════════════════════════════════════════

function renderGRN() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { setPageContent(errorHTML(res.message)); return; }
      const grns = res.data.grns || [];

      const vendors   = (ERP.dropdowns && ERP.dropdowns.vendors) || [];
      const vendorMap = {};
      vendors.forEach(function(v) { vendorMap[v.id] = v.name; });

      const enriched = grns.map(function(g) {
        return Object.assign({}, g, { VendorName: vendorMap[g.VendorID] || g.VendorID });
      });

      const html = renderDataTable({
        data:     enriched,
        title:    'Goods Receipt Notes',
        subtitle: 'Fabric received against Purchase Orders',
        addLabel: 'Create GRN',
        onAdd:    'openSelectPOForGRN',
        idKey:    'GRNID',
        onView:   'viewGRN',
        columns: [
          { key: 'GRNID',         label: 'GRN Number' },
          { key: 'GRNDate',       label: 'Date',         render: function(v) { return fmtDate(v); } },
          { key: 'VendorName',    label: 'Vendor' },
          { key: 'POID',          label: 'PO Number' },
          { key: 'ChallanNumber', label: 'Challan No.' },
          { key: 'CreatedBy',     label: 'Received By' }
        ]
      });
      setPageContent(html);
    })
    .withFailureHandler(function() { setPageContent(errorHTML('Failed to load GRNs')); })
    .serverGetGRNs(ERP.token, {});
}

function viewGRN(grnID) {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { showToast('error', 'Error', res.message); return; }
      const grn   = res.data.grn;
      const items = res.data.items || [];

      const fabrics = (ERP.dropdowns && ERP.dropdowns.fabrics)      || [];
      const colors  = (ERP.dropdowns && ERP.dropdowns.fabricColors) || [];
      const fabricMap = {}; fabrics.forEach(function(f) { fabricMap[f.id] = f.code + ' — ' + f.name; });
      const colorMap  = {}; colors.forEach(function(c)  { colorMap[c.id]  = c.name; });

      const itemRows = items.map(function(i) {
        return `<tr>
          <td>${escHtml(fabricMap[i.FabricID]||i.FabricID)}</td>
          <td>${escHtml(colorMap[i.FabricColorID]||i.FabricColorID)}</td>
          <td style="text-align:right">${fmtNum(i.ReceivedQty)}</td>
          <td>${escHtml(i.UOM)}</td>
          <td>${escHtml(i.Remarks||'--')}</td>
        </tr>`;
      }).join('');

      openModal('GRN — ' + grn.GRNID, `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
          <div><label class="form-label">PO Number</label><div class="form-input" style="background:var(--surface2)">${escHtml(grn.POID)}</div></div>
          <div><label class="form-label">GRN Date</label><div class="form-input" style="background:var(--surface2)">${fmtDate(grn.GRNDate)}</div></div>
          <div><label class="form-label">Challan Number</label><div class="form-input" style="background:var(--surface2)">${escHtml(grn.ChallanNumber)}</div></div>
          <div><label class="form-label">Vehicle Number</label><div class="form-input" style="background:var(--surface2)">${escHtml(grn.VehicleNumber||'--')}</div></div>
        </div>
        <div style="font-weight:600;margin-bottom:8px">Items Received</div>
        <table class="data-table">
          <thead><tr><th>Fabric Design</th><th>Color</th><th style="text-align:right">Qty Received</th><th>UOM</th><th>Remarks</th></tr></thead>
          <tbody>${itemRows}</tbody>
        </table>
      `, `<button class="btn btn-primary" onclick="_closeModal()">Close</button>`, 'large');
    })
    .withFailureHandler(function() { showToast('error', 'Error', 'Failed to load GRN'); })
    .serverGetGRNByID(ERP.token, grnID);
}

function openSelectPOForGRN() {
  const vendors     = (ERP.dropdowns && ERP.dropdowns.vendors) || [];
  const vendorMap   = {};
  vendors.forEach(function(v) { vendorMap[v.id] = v.name; });

  openModal('Select Purchase Order for GRN', `
    <div class="form-group">
      <label class="form-label required">Purchase Order Number</label>
      <input class="form-input" id="grnPOInput" placeholder="Enter PO Number (e.g. PO-2026-00001)">
      <p style="font-size:12px;color:var(--text-muted);margin-top:4px">Only Approved or Partially Received POs are valid.</p>
    </div>
  `, `
    <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="loadPOForGRN()">Load PO</button>
  `);
}

function loadPOForGRN() {
  const poID = document.getElementById('grnPOInput').value.trim();
  if (!poID) { showToast('warning', 'Validation', 'Enter a PO Number'); return; }

  const btn = document.querySelector('#globalModal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showToast('error', 'Error', res.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Load PO'; }
        return;
      }
      _closeModal();
      openCreateGRN(poID, res.data);
    })
    .withFailureHandler(function() {
      showToast('error', 'Error', 'Failed to load PO');
      if (btn) btn.disabled = false;
    })
    .serverGetPOItemsForGRN(ERP.token, poID);
}

function openCreateGRN(poID, poData) {
  if (!poData) {
    // Load it
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res.success) { showToast('error', 'Error', res.message); return; }
        openCreateGRN(poID, res.data);
      })
      .serverGetPOItemsForGRN(ERP.token, poID);
    return;
  }

  const po    = poData.po;
  const items = poData.items || [];

  const fabrics = (ERP.dropdowns && ERP.dropdowns.fabrics)      || [];
  const colors  = (ERP.dropdowns && ERP.dropdowns.fabricColors) || [];
  const fabricMap = {}; fabrics.forEach(function(f) { fabricMap[f.id] = f.code + ' — ' + f.name; });
  const colorMap  = {}; colors.forEach(function(c)  { colorMap[c.id]  = c.name; });

  const today = new Date().toISOString().slice(0, 10);

  const itemRows = items.map(function(item, idx) {
    return `
      <tr>
        <td>${escHtml(fabricMap[item.FabricID]||item.FabricID)}</td>
        <td>${escHtml(colorMap[item.FabricColorID]||item.FabricColorID)}</td>
        <td style="text-align:right">${fmtNum(item.OrderedQty)}</td>
        <td style="text-align:right;color:var(--amber)">${fmtNum(item.PendingQty)}</td>
        <td>${escHtml(item.UOM)}</td>
        <td>
          <input class="form-input" id="grnRecvQty_${idx}" type="number" min="0.001"
                 max="${parseFloat(item.PendingQty)||0}" step="0.001"
                 value="${parseFloat(item.PendingQty)||0}"
                 style="min-width:80px"
                 data-poitemid="${escHtml(item.POItemID)}"
                 data-fabricid="${escHtml(item.FabricID)}"
                 data-colorid="${escHtml(item.FabricColorID)}"
                 data-uom="${escHtml(item.UOM)}">
        </td>
        <td><input class="form-input" id="grnItemRmk_${idx}" placeholder="Optional" style="min-width:80px"></td>
      </tr>
    `;
  }).join('');

  openModal('Create GRN — ' + poID, `
    <div style="background:var(--surface2);border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:13px">
      <strong>PO:</strong> ${escHtml(poID)} &nbsp;|&nbsp;
      <strong>Status:</strong> ${statusBadge(po.Status)}
    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label required">GRN Date</label>
        <input class="form-input" id="grnDate" type="date" value="${today}">
      </div>
      <div class="form-group">
        <label class="form-label required">Challan Number</label>
        <input class="form-input" id="grnChallan" placeholder="Vendor challan number">
      </div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group">
        <label class="form-label">Vehicle Number</label>
        <input class="form-input" id="grnVehicle" placeholder="e.g. MH 12 AB 1234">
      </div>
      <div class="form-group">
        <label class="form-label">Remarks</label>
        <input class="form-input" id="grnRemarks" placeholder="Optional">
      </div>
    </div>

    <div style="font-weight:600;margin-bottom:8px">Items to Receive</div>
    <div style="overflow-x:auto">
      <table class="data-table">
        <thead>
          <tr>
            <th>Fabric Design</th><th>Color</th>
            <th style="text-align:right">Ordered</th>
            <th style="text-align:right">Pending</th>
            <th>UOM</th>
            <th style="min-width:100px">Receive Qty *</th>
            <th style="min-width:100px">Remarks</th>
          </tr>
        </thead>
        <tbody>
          ${itemRows}
        </tbody>
      </table>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-top:8px">Set Receive Qty to 0 to skip an item in this GRN.</p>
  `, `
    <button class="btn btn-ghost" onclick="_closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveGRN('${escHtml(poID)}','${escHtml(po.VendorID)}',${items.length})">Save GRN</button>
  `, 'large');
}

function saveGRN(poID, vendorID, itemCount) {
  const grnDate  = document.getElementById('grnDate').value;
  const challan  = document.getElementById('grnChallan').value.trim();
  const vehicle  = document.getElementById('grnVehicle').value.trim();
  const remarks  = document.getElementById('grnRemarks').value.trim();

  if (!grnDate)  { showToast('warning', 'Validation', 'GRN Date is required'); return; }
  if (!challan)  { showToast('warning', 'Validation', 'Challan Number is required'); return; }

  const grnItems = [];
  for (let i = 0; i < itemCount; i++) {
    const el = document.getElementById('grnRecvQty_' + i);
    if (!el) continue;
    const qty = parseFloat(el.value) || 0;
    if (qty <= 0) continue; // Skip items with 0 qty

    grnItems.push({
      POItemID:      el.dataset.poitemid,
      FabricID:      el.dataset.fabricid,
      FabricColorID: el.dataset.colorid,
      ReceivedQty:   qty,
      UOM:           el.dataset.uom,
      Remarks:       document.getElementById('grnItemRmk_' + i) ? document.getElementById('grnItemRmk_' + i).value.trim() : ''
    });
  }

  if (grnItems.length === 0) { showToast('warning', 'Validation', 'At least one item must have a Receive Qty > 0'); return; }

  const btn = document.querySelector('#globalModal .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showToast('error', 'Error', res.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Save GRN'; }
        return;
      }
      showToast('success', 'GRN Created', 'GRN saved. PO Status: ' + res.data.POStatus);
      _closeModal();
      renderGRN();
    })
    .withFailureHandler(function() {
      showToast('error', 'Error', 'Failed to save GRN');
      if (btn) btn.disabled = false;
    })
    .serverCreateGRN(ERP.token, { GRNDate: grnDate, VendorID: vendorID, POID: poID, ChallanNumber: challan, VehicleNumber: vehicle, Remarks: remarks, items: grnItems });
}
</script>

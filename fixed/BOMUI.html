=<script>
// ============================================================
// BOMUI.html — BOM Manager (Sprint S2)
// Full BOM matrix editor: Article → Size × Color × Fabric × Consumption
// ============================================================

// ── BOM STATE ───────────────────────────────────────────────
var BOM_STATE = {
  articleID:  null,
  articleName: '',
  rows:       [],   // Array of row objects
  rowCounter: 0
};

// ══════════════════════════════════════════════════════════════
// RENDER BOM PAGE
// ══════════════════════════════════════════════════════════════

function renderBOM() {
  // Always reload dropdowns to get latest articles/fabrics/colors
  loadDropdowns(function() { _renderBOMPage(); });
}

function _renderBOMPage() {
  const articles = (ERP.dropdowns && ERP.dropdowns.articles) || [];
  const buyers   = (ERP.dropdowns && ERP.dropdowns.buyers)   || [];

  const buyerMap = {};
  buyers.forEach(function(b) { buyerMap[b.id] = b.name; });

  const articleOptions = articles.map(function(a) {
    const buyerName = buyerMap[a.buyerID] || '';
    return `<option value="${escHtml(a.id)}">${escHtml(a.code)} — ${escHtml(a.name)} (${escHtml(buyerName)})</option>`;
  }).join('');

  setPageContent(`
    <div class="page-header">
      <div>
        <h1 class="page-title">Bill of Materials</h1>
        <p class="page-subtitle">Define fabric consumption per Article × Size × Color</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="card-header"><span class="card-title">Select Article</span></div>
      <div style="padding:16px 20px">
        <div class="form-row cols-2">
          <div class="form-group">
            <label class="form-label required">Article / Style</label>
            <select class="form-select" id="bomArticleSelect" onchange="loadBOMForArticle()">
              <option value="">-- Select Article to view/edit BOM --</option>
              ${articleOptions}
            </select>
          </div>
        </div>
      </div>
    </div>

    <div id="bomEditorArea"></div>
  `);
}

function loadBOMForArticle() {
  const articleID = document.getElementById('bomArticleSelect').value;
  if (!articleID) {
    document.getElementById('bomEditorArea').innerHTML = '';
    return;
  }

  const articles = (ERP.dropdowns && ERP.dropdowns.articles) || [];
  const art      = articles.find(function(a) { return a.id === articleID; });

  document.getElementById('bomEditorArea').innerHTML = '<div class="page-loader"><div class="loader-spinner"></div><p>Loading BOM...</p></div>';

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        document.getElementById('bomEditorArea').innerHTML = errorHTML(res.message);
        return;
      }
      BOM_STATE.articleID   = articleID;
      BOM_STATE.articleName = art ? art.name : articleID;
      BOM_STATE.rows        = [];
      BOM_STATE.rowCounter  = 0;

      const bomLines = res.data.bom || [];

      // Load existing BOM lines into state
      bomLines.forEach(function(line) {
        BOM_STATE.rows.push({
          id:        '_' + (++BOM_STATE.rowCounter),
          bomID:     line.BOMID,
          size:      line.Size,
          color:     line.Color,
          fabricID:  line.FabricID,
          fabricColorID: line.FabricColorID,
          consumption: line.ConsumptionPerPc,
          uom:       line.UOM,
          wastage:   line.WastagePercent,
          remarks:   line.Remarks
        });
      });

      renderBOMEditor();
    })
    .withFailureHandler(function() {
      document.getElementById('bomEditorArea').innerHTML = errorHTML('Failed to load BOM');
    })
    .serverGetBOM(ERP.token, articleID, {});
}

function renderBOMEditor() {
  const sizes   = (ERP.dropdowns && ERP.dropdowns.sizes)   || [];
  const fabrics = (ERP.dropdowns && ERP.dropdowns.fabrics) || [];
  const colors  = (ERP.dropdowns && ERP.dropdowns.fabricColors) || [];

  const sizeOptions = sizes.map(function(s) {
    return `<option value="${escHtml(s)}">${escHtml(s)}</option>`;
  }).join('');

  const fabricOptions = fabrics.map(function(f) {
    return `<option value="${escHtml(f.id)}">${escHtml(f.code)} — ${escHtml(f.name)}</option>`;
  }).join('');

  const rows = BOM_STATE.rows.map(function(row) {
    return renderBOMRow(row, sizeOptions, fabricOptions, colors);
  }).join('');

  document.getElementById('bomEditorArea').innerHTML = `
    <div class="card">
      <div class="card-header">
        <span class="card-title">BOM Editor — ${escHtml(BOM_STATE.articleName)}</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" style="font-size:12px" onclick="addBOMRow()">+ Add Row</button>
          <button class="btn btn-primary" onclick="saveBOM()">💾 Save BOM</button>
        </div>
      </div>

      <div style="overflow-x:auto;padding:0 0 8px">
        <table class="data-table" id="bomTable">
          <thead>
            <tr>
              <th style="min-width:90px">Size *</th>
              <th style="min-width:120px">Color *</th>
              <th style="min-width:180px">Fabric Design *</th>
              <th style="min-width:160px">Fabric Color *</th>
              <th style="min-width:120px">Consumption (per pc) *</th>
              <th style="min-width:90px">UOM *</th>
              <th style="min-width:90px">Wastage %</th>
              <th style="min-width:100px">Effective</th>
              <th style="min-width:140px">Remarks</th>
              <th style="min-width:50px"></th>
            </tr>
          </thead>
          <tbody id="bomTableBody">
            ${rows}
            ${BOM_STATE.rows.length === 0 ? `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--text-muted)">No BOM lines. Click "+ Add Row" to begin.</td></tr>` : ''}
          </tbody>
        </table>
      </div>

      <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:13px;color:var(--text-muted)">${BOM_STATE.rows.length} line(s)</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost" onclick="addBOMRow()">+ Add Row</button>
          <button class="btn btn-primary" onclick="saveBOM()">💾 Save BOM</button>
        </div>
      </div>
    </div>
  `;
}

function renderBOMRow(row, sizeOptions, fabricOptions, colors) {
  const rid = row.id;

  // Build fabric color options for this row's fabric
  const colorOpts = _buildColorOptions(row.fabricID, row.fabricColorID, colors);

  const effectiveQty = row.consumption
    ? (parseFloat(row.consumption) * (1 + (parseFloat(row.wastage) || 0) / 100)).toFixed(4)
    : '';

  return `
    <tr id="bomRow_${rid}" data-rowid="${rid}">
      <td>
        <select class="form-select" id="bomSize_${rid}" style="min-width:80px">
          <option value="">--</option>
          ${sizeOptions.replace(`value="${escHtml(row.size)}"`, `value="${escHtml(row.size)}" selected`)}
        </select>
      </td>
      <td>
        <input class="form-input" id="bomColor_${rid}" value="${escHtml(row.color || '')}" placeholder="e.g. Navy Blue" style="min-width:110px">
      </td>
      <td>
        <select class="form-select" id="bomFabric_${rid}" style="min-width:170px" onchange="onBOMFabricChange('${rid}')">
          <option value="">-- Select --</option>
          ${fabricOptions.replace(`value="${escHtml(row.fabricID)}"`, `value="${escHtml(row.fabricID)}" selected`)}
        </select>
      </td>
      <td>
        <select class="form-select" id="bomFabricColor_${rid}" style="min-width:150px">
          <option value="">-- Select --</option>
          ${colorOpts}
        </select>
      </td>
      <td>
        <input class="form-input" id="bomConsumption_${rid}" type="number" step="0.0001" min="0.0001"
               value="${row.consumption || ''}" placeholder="1.5000"
               style="min-width:110px" oninput="updateEffective('${rid}')">
      </td>
      <td>
        <select class="form-select" id="bomUOM_${rid}" style="min-width:80px">
          <option value="Meters" ${(row.uom||'Meters')==='Meters'?'selected':''}>Meters</option>
          <option value="Yards"  ${row.uom==='Yards'?'selected':''}>Yards</option>
        </select>
      </td>
      <td>
        <input class="form-input" id="bomWastage_${rid}" type="number" step="0.01" min="0" max="100"
               value="${row.wastage || 0}" placeholder="0"
               style="min-width:70px" oninput="updateEffective('${rid}')">
      </td>
      <td>
        <span id="bomEffective_${rid}" style="color:var(--amber);font-weight:600;font-family:var(--font-mono);font-size:13px">${effectiveQty}</span>
      </td>
      <td>
        <input class="form-input" id="bomRemarks_${rid}" value="${escHtml(row.remarks || '')}" placeholder="Optional">
      </td>
      <td>
        <button class="action-btn delete" onclick="removeBOMRow('${rid}')" title="Remove row">✕</button>
      </td>
    </tr>
  `;
}

function _buildColorOptions(fabricID, selectedColorID, allColors) {
  if (!fabricID) return '';
  return allColors
    .filter(function(c) { return c.fabricID === fabricID; })
    .map(function(c) {
      const sel = c.id === selectedColorID ? 'selected' : '';
      return `<option value="${escHtml(c.id)}" ${sel}>${escHtml(c.name)}</option>`;
    }).join('');
}

function addBOMRow() {
  const sizes   = (ERP.dropdowns && ERP.dropdowns.sizes)   || [];
  const fabrics = (ERP.dropdowns && ERP.dropdowns.fabrics) || [];
  const colors  = (ERP.dropdowns && ERP.dropdowns.fabricColors) || [];

  const sizeOptions   = sizes.map(function(s) { return `<option value="${escHtml(s)}">${escHtml(s)}</option>`; }).join('');
  const fabricOptions = fabrics.map(function(f) { return `<option value="${escHtml(f.id)}">${escHtml(f.code)} — ${escHtml(f.name)}</option>`; }).join('');

  const rid = '_' + (++BOM_STATE.rowCounter);
  const row = { id: rid, bomID: '', size: '', color: '', fabricID: '', fabricColorID: '', consumption: '', uom: 'Meters', wastage: 0, remarks: '' };
  BOM_STATE.rows.push(row);

  const tbody = document.getElementById('bomTableBody');
  // Remove "no lines" placeholder if present
  if (tbody.querySelector('td[colspan]')) tbody.innerHTML = '';

  const tr = document.createElement('tr');
  tr.id              = 'bomRow_' + rid;
  tr.dataset.rowid   = rid;
  tr.innerHTML       = renderBOMRow(row, sizeOptions, fabricOptions, colors).replace(/^<tr[^>]*>/, '').replace(/<\/tr>$/, '');
  tbody.appendChild(tr);
}

function removeBOMRow(rid) {
  BOM_STATE.rows = BOM_STATE.rows.filter(function(r) { return r.id !== rid; });
  const tr = document.getElementById('bomRow_' + rid);
  if (tr) tr.remove();
  if (document.getElementById('bomTableBody').children.length === 0) {
    document.getElementById('bomTableBody').innerHTML =
      '<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--text-muted)">No BOM lines. Click "+ Add Row" to begin.</td></tr>';
  }
}

function onBOMFabricChange(rid) {
  const fabricID = document.getElementById('bomFabric_' + rid).value;
  const colors   = (ERP.dropdowns && ERP.dropdowns.fabricColors) || [];
  const colorSel = document.getElementById('bomFabricColor_' + rid);
  colorSel.innerHTML = '<option value="">-- Select Color --</option>' + _buildColorOptions(fabricID, '', colors);
}

function updateEffective(rid) {
  const c = parseFloat(document.getElementById('bomConsumption_' + rid).value) || 0;
  const w = parseFloat(document.getElementById('bomWastage_'     + rid).value) || 0;
  const eff = c > 0 ? (c * (1 + w / 100)).toFixed(4) : '';
  document.getElementById('bomEffective_' + rid).textContent = eff;
}

function saveBOM() {
  if (!BOM_STATE.articleID) { showToast('warning', 'Validation', 'No article selected'); return; }

  // Collect rows from DOM
  const rows   = document.querySelectorAll('#bomTableBody tr[data-rowid]');
  const items  = [];
  let hasError = false;

  rows.forEach(function(tr) {
    if (hasError) return;
    const rid = tr.dataset.rowid;

    const size          = document.getElementById('bomSize_'        + rid).value;
    const color         = document.getElementById('bomColor_'       + rid).value.trim();
    const fabricID      = document.getElementById('bomFabric_'      + rid).value;
    const fabricColorID = document.getElementById('bomFabricColor_' + rid).value;
    const consumption   = document.getElementById('bomConsumption_' + rid).value;
    const uom           = document.getElementById('bomUOM_'         + rid).value;
    const wastage       = document.getElementById('bomWastage_'     + rid).value || '0';
    const remarks       = document.getElementById('bomRemarks_'     + rid).value.trim();

    if (!size || !color || !fabricID || !fabricColorID || !consumption) {
      showToast('warning', 'Validation', 'All required fields must be filled in each row (Size, Color, Fabric, Fabric Color, Consumption)');
      hasError = true;
      return;
    }
    if (parseFloat(consumption) <= 0) {
      showToast('warning', 'Validation', 'Consumption must be greater than 0');
      hasError = true;
      return;
    }

    items.push({ Size: size, Color: color, FabricID: fabricID, FabricColorID: fabricColorID, ConsumptionPerPc: parseFloat(consumption), UOM: uom, WastagePercent: parseFloat(wastage), Remarks: remarks });
  });

  if (hasError) return;

  const saveBtn = document.querySelector('.card .btn-primary');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving...'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) {
        showToast('error', 'Error', res.message);
        if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '💾 Save BOM'; }
        return;
      }
      showToast('success', 'Success', res.message || 'BOM saved successfully');
      loadBOMForArticle(); // Reload to get assigned IDs
    })
    .withFailureHandler(function() {
      showToast('error', 'Error', 'Failed to save BOM');
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '💾 Save BOM'; }
    })
    .serverSaveBOM(ERP.token, BOM_STATE.articleID, items);
}
</script>

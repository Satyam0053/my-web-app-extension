<script>
// ============================================================
// ReportUI.html — Reports & Dashboards (Sprint S11)
// ============================================================

function renderReports() {
  setPageTitle('Reports & Dashboards');
  document.getElementById('pageContent').innerHTML = `
    <div class="page-header">
      <div><h1 class="page-title">Reports & Dashboards</h1><p class="page-subtitle">Business overview across all modules</p></div>
    </div>
    <div class="report-tabs">
      <button class="report-tab active" onclick="switchReportTab(this,'rpt-sales')">📋 Sales</button>
      <button class="report-tab" onclick="switchReportTab(this,'rpt-purchase')">🛒 Purchase</button>
      <button class="report-tab" onclick="switchReportTab(this,'rpt-inventory')">🧵 Inventory</button>
      <button class="report-tab" onclick="switchReportTab(this,'rpt-production')">⚙️ Production</button>
      <button class="report-tab" onclick="switchReportTab(this,'rpt-dispatch')">🚚 Dispatch</button>
    </div>
    <div id="rpt-sales"     class="report-panel"><div class="loading-spinner"></div></div>
    <div id="rpt-purchase"  class="report-panel" style="display:none"></div>
    <div id="rpt-inventory" class="report-panel" style="display:none"></div>
    <div id="rpt-production"class="report-panel" style="display:none"></div>
    <div id="rpt-dispatch"  class="report-panel" style="display:none"></div>
  `;
  loadSalesReport();
}

function switchReportTab(btn, panelID) {
  document.querySelectorAll('.report-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.report-panel').forEach(function(p) { p.style.display='none'; });
  btn.classList.add('active');
  var panel = document.getElementById(panelID);
  panel.style.display = 'block';
  if (panel.innerHTML.trim() === '' || panel.innerHTML.includes('loading-spinner')) {
    var loaders = { 'rpt-purchase': loadPurchaseReport, 'rpt-inventory': loadInventoryReport, 'rpt-production': loadProductionReport, 'rpt-dispatch': loadDispatchReport };
    if (loaders[panelID]) loaders[panelID]();
  }
}

// ── Sales Report ─────────────────────────────────────────────
function loadSalesReport() {
  var panel = document.getElementById('rpt-sales');
  if (panel) panel.innerHTML = '<div class="loading-spinner"></div>';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { document.getElementById('rpt-sales').innerHTML = errorHTML(res.message); return; }
      renderSalesReport(res.data);
    })
    .withFailureHandler(function(e) { document.getElementById('rpt-sales').innerHTML = errorHTML(e.message); })
    .serverGetSalesReport(ERP.token, {});
}

function renderSalesReport(d) {
  var buyerRows = Object.entries(d.byBuyer||{}).map(function(e) {
    return '<tr><td>'+escHtml(e[0])+'</td><td>'+e[1].orders+'</td><td>'+fmtNum(e[1].pieces)+'</td></tr>';
  }).join('');
  var articleRows = Object.entries(d.byArticle||{}).sort(function(a,b){return b[1]-a[1];}).slice(0,10).map(function(e) {
    return '<tr><td>'+escHtml(e[0])+'</td><td>'+fmtNum(e[1])+'</td></tr>';
  }).join('');
  var statusRows = Object.entries(d.statusCounts||{}).map(function(e) {
    return '<tr><td>'+statusBadge(e[0])+'</td><td>'+e[1]+'</td></tr>';
  }).join('');

  document.getElementById('rpt-sales').innerHTML = `
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
      <div class="card"><div class="stat-icon" style="background:var(--blue-dim);color:var(--blue)">📋</div>
        <div class="stat-value">${d.totalOrders}</div><div class="stat-label">Total Orders</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--green-dim);color:var(--green)">👕</div>
        <div class="stat-value">${fmtNum(d.totalPieces)}</div><div class="stat-label">Total Pieces</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--purple-dim);color:var(--purple)">🏢</div>
        <div class="stat-value">${Object.keys(d.byBuyer||{}).length}</div><div class="stat-label">Active Buyers</div></div>
    </div>
    <div class="report-grid">
      <div class="report-section">
        <div class="section-divider">Order Status Breakdown</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>${statusRows||'<tr><td colspan="2" class="text-muted">No data</td></tr>'}</tbody></table></div>
      </div>
      <div class="report-section">
        <div class="section-divider">Buyer-wise Orders</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Buyer</th><th>Orders</th><th>Pieces</th></tr></thead><tbody>${buyerRows||'<tr><td colspan="3" class="text-muted">No data</td></tr>'}</tbody></table></div>
      </div>
      <div class="report-section">
        <div class="section-divider">Top Articles by Pieces</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Article</th><th>Pieces</th></tr></thead><tbody>${articleRows||'<tr><td colspan="2" class="text-muted">No data</td></tr>'}</tbody></table></div>
      </div>
    </div>
  `;
}

// ── Purchase Report ──────────────────────────────────────────
function loadPurchaseReport() {
  var panel = document.getElementById('rpt-purchase');
  panel.innerHTML = '<div class="loading-spinner"></div>';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { panel.innerHTML = errorHTML(res.message); return; }
      renderPurchaseReport(res.data);
    })
    .withFailureHandler(function(e) { panel.innerHTML = errorHTML(e.message); })
    .serverGetPurchaseDashboard(ERP.token);
}

function renderPurchaseReport(d) {
  var vendorRows = Object.entries(d.byVendor||{}).map(function(e){
    return '<tr><td>'+escHtml(e[0])+'</td><td>'+e[1]+'</td></tr>';
  }).join('');
  var statusRows = Object.entries(d.statusCounts||{}).map(function(e){
    return '<tr><td>'+statusBadge(e[0])+'</td><td>'+e[1]+'</td></tr>';
  }).join('');
  var grnRows = (d.recentGRNs||[]).map(function(g){
    return '<tr><td class="mono-sm">'+escHtml(g.GRNID)+'</td><td>'+fmtDate(g.GRNDate)+'</td><td>'+escHtml(g.VendorName)+'</td></tr>';
  }).join('');

  document.getElementById('rpt-purchase').innerHTML = `
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px">
      <div class="card"><div class="stat-icon" style="background:var(--blue-dim);color:var(--blue)">🛒</div>
        <div class="stat-value">${d.totalPOs}</div><div class="stat-label">Total POs</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--green-dim);color:var(--green)">💰</div>
        <div class="stat-value">₹${fmtNum(d.totalValue)}</div><div class="stat-label">Total PO Value</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--orange-dim);color:var(--orange)">⏳</div>
        <div class="stat-value">${d.pendingRecv}</div><div class="stat-label">Pending Receipt</div></div>
    </div>
    <div class="report-grid">
      <div class="report-section">
        <div class="section-divider">PO Status</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>${statusRows||'<tr><td colspan="2" class="text-muted">No data</td></tr>'}</tbody></table></div>
      </div>
      <div class="report-section">
        <div class="section-divider">Vendor-wise POs</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Vendor</th><th>POs</th></tr></thead><tbody>${vendorRows||'<tr><td colspan="2" class="text-muted">No data</td></tr>'}</tbody></table></div>
      </div>
      <div class="report-section">
        <div class="section-divider">Recent GRNs</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>GRN ID</th><th>Date</th><th>Vendor</th></tr></thead><tbody>${grnRows||'<tr><td colspan="3" class="text-muted">No GRNs</td></tr>'}</tbody></table></div>
      </div>
    </div>
  `;
}

// ── Inventory Report ─────────────────────────────────────────
function loadInventoryReport() {
  var panel = document.getElementById('rpt-inventory');
  panel.innerHTML = '<div class="loading-spinner"></div>';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { panel.innerHTML = errorHTML(res.message); return; }
      renderInventoryReport(res.data);
    })
    .withFailureHandler(function(e) { panel.innerHTML = errorHTML(e.message); })
    .serverGetInventoryDashboard(ERP.token);
}

function renderInventoryReport(d) {
  var invRows = (d.inventory||[]).slice(0,20).map(function(i){
    var cls = i.AvailableQty <= 0 ? 'color:var(--red)' : i.IsLow ? 'color:var(--orange)' : '';
    return '<tr><td>'+escHtml(i.FabricName)+'</td><td>'+escHtml(i.ColorName)+'</td><td>'+fmtNum(i.ReceivedQty)+'</td><td>'+fmtNum(i.IssuedQty)+'</td><td style="'+cls+'"><strong>'+fmtNum(i.AvailableQty)+'</strong></td></tr>';
  }).join('');

  document.getElementById('rpt-inventory').innerHTML = `
    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="card"><div class="stat-icon" style="background:var(--blue-dim);color:var(--blue)">🧵</div>
        <div class="stat-value">${d.totalItems}</div><div class="stat-label">Total Items</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--green-dim);color:var(--green)">📥</div>
        <div class="stat-value">${fmtNum(d.totalReceived)}</div><div class="stat-label">Total Received</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--purple-dim);color:var(--purple)">📤</div>
        <div class="stat-value">${fmtNum(d.totalIssued)}</div><div class="stat-label">Total Issued</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--red-dim);color:var(--red)">⚠️</div>
        <div class="stat-value">${d.lowStockCount}</div><div class="stat-label">Low Stock</div></div>
    </div>
    <div class="section-divider">Inventory — Sorted by Availability (lowest first, top 20)</div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>Fabric</th><th>Color</th><th>Received</th><th>Issued</th><th>Available</th></tr></thead><tbody>${invRows||'<tr><td colspan="5" class="text-muted">No inventory data</td></tr>'}</tbody></table></div>
  `;
}

// ── Production Report ─────────────────────────────────────────
function loadProductionReport() {
  var panel = document.getElementById('rpt-production');
  panel.innerHTML = '<div class="loading-spinner"></div>';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { panel.innerHTML = errorHTML(res.message); return; }
      renderProductionReport(res.data);
    })
    .withFailureHandler(function(e) { panel.innerHTML = errorHTML(e.message); })
    .serverGetProductionDashboard(ERP.token);
}

function renderProductionReport(d) {
  var pc = d.processCounts || {};
  var stageRows = [
    ['Pre-Cutting',pc['Pre-Cutting']||0],['Cutting',pc['Cutting']||0],
    ['Pre-Stitching',pc['Pre-Stitching']||0],['Stitching',pc['Stitching']||0],
    ['Pre-Finishing',pc['Pre-Finishing']||0],['Finishing',pc['Finishing']||0],
    ['Pre-Packing',pc['Pre-Packing']||0],['Packing',pc['Packing']||0],
    ['Completed',pc['Completed']||0]
  ].map(function(s){
    return '<tr><td>'+escHtml(s[0])+'</td><td>'+fmtNum(s[1])+'</td></tr>';
  }).join('');

  var planRows = (d.planProgress||[]).map(function(p){
    var bar = '<div style="background:var(--bg-elevated);border-radius:4px;height:8px;width:100%;min-width:80px"><div style="background:var(--accent);height:8px;border-radius:4px;width:'+p.PctDone+'%"></div></div>';
    return '<tr><td class="mono-sm">'+escHtml(p.PlanID)+'</td><td>'+escHtml(p.SONumber)+'</td><td>'+escHtml(p.ArticleName)+'</td><td>'+p.TotalBundles+'</td><td>'+p.Packed+'</td><td>'+p.PctDone+'%'+bar+'</td></tr>';
  }).join('');

  document.getElementById('rpt-production').innerHTML = `
    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="card"><div class="stat-icon" style="background:var(--blue-dim);color:var(--blue)">📋</div>
        <div class="stat-value">${d.totalPlans}</div><div class="stat-label">Total Plans</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--orange-dim);color:var(--orange)">⚙️</div>
        <div class="stat-value">${d.activePlans}</div><div class="stat-label">Active Plans</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--green-dim);color:var(--green)">✅</div>
        <div class="stat-value">${d.completedPlans}</div><div class="stat-label">Completed</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--purple-dim);color:var(--purple)">📦</div>
        <div class="stat-value">${d.totalBundles}</div><div class="stat-label">Total Bundles</div></div>
    </div>
    <div class="report-grid">
      <div class="report-section">
        <div class="section-divider">Bundles by Process Stage</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Stage</th><th>Bundles</th></tr></thead><tbody>${stageRows}</tbody></table></div>
      </div>
      <div class="report-section" style="grid-column:span 2">
        <div class="section-divider">Active Plan Progress</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Plan ID</th><th>SO</th><th>Article</th><th>Total</th><th>Packed</th><th>Progress</th></tr></thead><tbody>${planRows||'<tr><td colspan="6" class="text-muted">No active plans</td></tr>'}</tbody></table></div>
      </div>
    </div>
  `;
}

// ── Dispatch Report ───────────────────────────────────────────
function loadDispatchReport() {
  var panel = document.getElementById('rpt-dispatch');
  panel.innerHTML = '<div class="loading-spinner"></div>';
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.success) { panel.innerHTML = errorHTML(res.message); return; }
      renderDispatchReport(res.data);
    })
    .withFailureHandler(function(e) { panel.innerHTML = errorHTML(e.message); })
    .serverGetDispatchDashboard(ERP.token);
}

function renderDispatchReport(d) {
  var buyerRows = Object.entries(d.byBuyer||{}).map(function(e){
    return '<tr><td>'+escHtml(e[0])+'</td><td>'+fmtNum(e[1])+'</td></tr>';
  }).join('');
  var recentRows = (d.recentDispatches||[]).map(function(r){
    return '<tr><td class="mono-sm">'+escHtml(r.DispatchID)+'</td><td>'+fmtDate(r.DispatchDate)+'</td><td>'+escHtml(r.SONumber)+'</td><td>'+escHtml(r.BuyerName)+'</td><td>'+fmtNum(r.TotalPieces)+'</td></tr>';
  }).join('');

  document.getElementById('rpt-dispatch').innerHTML = `
    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="card"><div class="stat-icon" style="background:var(--blue-dim);color:var(--blue)">🚚</div>
        <div class="stat-value">${d.totalDispatches}</div><div class="stat-label">Total Dispatches</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--green-dim);color:var(--green)">👕</div>
        <div class="stat-value">${fmtNum(d.totalPieces)}</div><div class="stat-label">Total Pieces</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--purple-dim);color:var(--purple)">📅</div>
        <div class="stat-value">${d.thisMonthCount}</div><div class="stat-label">This Month</div></div>
      <div class="card"><div class="stat-icon" style="background:var(--orange-dim);color:var(--orange)">📦</div>
        <div class="stat-value">${d.pendingBundles}</div><div class="stat-label">Pending Dispatch</div></div>
    </div>
    <div class="report-grid">
      <div class="report-section">
        <div class="section-divider">Buyer-wise Pieces</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Buyer</th><th>Pieces</th></tr></thead><tbody>${buyerRows||'<tr><td colspan="2" class="text-muted">No data</td></tr>'}</tbody></table></div>
      </div>
      <div class="report-section" style="grid-column:span 2">
        <div class="section-divider">Recent Dispatches</div>
        <div class="table-scroll"><table class="data-table"><thead><tr><th>Dispatch ID</th><th>Date</th><th>SO</th><th>Buyer</th><th>Pieces</th></tr></thead><tbody>${recentRows||'<tr><td colspan="5" class="text-muted">No dispatches yet</td></tr>'}</tbody></table></div>
      </div>
    </div>
  `;
}
</script>
